upstream api {
    server api:3000;
}

upstream frontend {
    server frontend:3001;
}

upstream frontend2 {
    server frontend2:3002;
}

server {
    listen 80;
    server_name _;

    absolute_redirect off;

    client_max_body_size 50m;

    location = /api {
        return 308 /api/;
    }

    # Frontend-facing API sub-apps are mounted on the FastAPI app under its
    # root_path, so they are served at the FULL /api/app/v1 and /api/app/v2
    # paths. proxy_pass without a URI preserves the original path unchanged
    # (no /api strip), unlike the /api/ location below. Longest-prefix match
    # routes /api/app/* here.
    location /api/app/ {
        proxy_pass         http://api;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_set_header   X-Forwarded-Host   $host;
        proxy_set_header   X-Forwarded-Prefix /api;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass         http://api/;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_set_header   X-Forwarded-Host   $host;
        proxy_set_header   X-Forwarded-Prefix /api;
        proxy_read_timeout 60s;
    }

    # frontend (v1) — Next.js app served under basePath /app/v1. The prefix is
    # preserved upstream (no rewrite) because Next expects it. UI, BFF routes
    # under /app/v1/bff/*, and Auth.js under /app/v1/bff/auth/* all live here.
    location /app/v1 {
        proxy_buffer_size        32k;
        proxy_buffers            8 32k;
        proxy_busy_buffers_size  32k;
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $http_host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # frontend2 (v2) — Next.js app served under basePath /app/v2.
    location /app/v2 {
        proxy_buffer_size        32k;
        proxy_buffers            8 32k;
        proxy_busy_buffers_size  32k;
        proxy_pass         http://frontend2;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $http_host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
