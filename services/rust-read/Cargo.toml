[package]
name = "hyperp-rust-read"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
axum = "0.8.4"
base64 = "0.22.1"
chrono = { version = "0.4.41", features = ["serde"] }
hmac = "0.12.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "json"] }
subtle = "2.6.1"
tokio = { version = "1.45.1", features = ["macros", "net", "rt-multi-thread"] }
url = "2.5.4"
uuid = { version = "=1.17.0", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1.3"
tower = { version = "0.5.2", features = ["util"] }
