[project]
name = "hyperp-intelligence"
version = "0.1.0"
description = "Bounded single-container Intelligence runtime"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
intelligence = "intelligence.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intelligence"]

[dependency-groups]
dev = [
    "mypy>=1.20.0",
    "pytest>=8.0,<9",
    "ruff>=0.15.9",
]
