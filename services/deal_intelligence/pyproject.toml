[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "profile-unifier-deal-intelligence"
version = "0.1.0"
description = "Disabled PostgreSQL platform foundation for HyperP Deal Intelligence"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.2,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
deal-intelligence-api = "deal_intelligence.api:main"
deal-intelligence-health = "deal_intelligence.health:main"
deal-intelligence-migrate = "deal_intelligence.migrations.cli:main"
deal-intelligence-scheduler = "deal_intelligence.scheduler:main"
deal-intelligence-worker = "deal_intelligence.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deal_intelligence"]
