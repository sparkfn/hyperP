  # â”€â”€ OAuth client credentials â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  /v1/oauth/token:
    post:
      tags: [OAuth]
      summary: Issue an OAuth2 client-credentials access token
      operationId: createOAuthToken
      description: |
        Exchanges an OAuth client ID and one active client secret for a short-lived
        HyperP-issued RS256 JWT access token. This endpoint uses OAuth-compatible
        top-level JSON responses rather than the standard HyperP response envelope.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAuthTokenRequest'
            encoding:
              grant_type:
                style: form
              client_id:
                style: form
              client_secret:
                style: form
              scope:
                style: form
            example:
              grant_type: client_credentials
              client_id: hpc_2VhJd9uLS2wK8f3P
              client_secret: hps_Yh7j...redacted
              scope: persons:read
      responses:
        '200':
          description: |
            Access token issued. Response includes `Cache-Control: no-store` and
            `Pragma: no-cache` headers.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenResponse'
        '400':
          description: OAuth token request failed with `invalid_request`, `invalid_scope`, or `unsupported_grant_type`.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthErrorResponse'
        '401':
          description: OAuth token request failed with `invalid_client`.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthErrorResponse'
  /v1/oauth/jwks:
    get:
      tags: [OAuth]
      summary: Return public signing keys for HyperP-issued access tokens
      operationId: getOAuthJwks
      security: []
      responses:
        '200':
          description: JSON Web Key Set containing active OAuth signing keys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonWebKeySet'
  # â”€â”€ Machine OAuth2 API surface (mounted at /oauth2/v1) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Dedicated server-to-server mount, served externally at /api/oauth2/v1. The
  # token/JWKS endpoints mirror the root /v1/oauth flow without the redundant
  # /oauth path segment; the person endpoints are OAuth2-client-only (human
  # Google tokens are rejected) and require the persons:read scope.
  /oauth2/v1/token:
    post:
      tags: [OAuth2 Machine API]
      summary: Issue an OAuth2 client-credentials access token (machine surface)
      operationId: createOAuthTokenMachine
      description: |
        Identical contract to `POST /v1/oauth/token`, exposed on the dedicated
        machine mount. Uses OAuth-compatible top-level JSON responses rather than
        the standard HyperP envelope. Response carries `Cache-Control: no-store`
        and `Pragma: no-cache`.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAuthTokenRequest'
            encoding:
              grant_type:
                style: form
              client_id:
                style: form
              client_secret:
                style: form
              scope:
                style: form
      responses:
        '200':
          description: Access token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenResponse'
        '400':
          description: Failed with `invalid_request`, `invalid_scope`, or `unsupported_grant_type`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthErrorResponse'
        '401':
          description: Failed with `invalid_client`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthErrorResponse'
  /oauth2/v1/jwks:
    get:
      tags: [OAuth2 Machine API]
      summary: Public signing keys for HyperP-issued access tokens (machine surface)
      operationId: getOAuthJwksMachine
      description: Identical to `GET /v1/oauth/jwks`, exposed on the machine mount.
      security: []
      responses:
        '200':
          description: JSON Web Key Set containing active OAuth signing keys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonWebKeySet'
  /oauth2/v1/persons:
    get:
      tags: [OAuth2 Machine API]
      summary: List canonical persons (machine surface)
      operationId: listPersonsMachine
      description: >-
        Paginated generalized person list. Filters are combined with AND semantics;
        repeated entity/source keys use their corresponding mode. CRM deal bounds
        count distinct active Bitrix CRM deal source records and are inclusive.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: q
          in: query
          description: |
            Free-text search (min 3 chars) across `preferred_full_name`,
            `preferred_nric`, `preferred_email`, and `preferred_phone`.
          schema:
            type: string
          example: "Tan Wei Ming"
        - name: cursor
          in: query
          description: Opaque pagination cursor.
          schema:
            type: string
        - name: limit
          in: query
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: entity_key
          in: query
          schema:
            type: array
            items:
              type: string
          example: ["fundbox-sg"]
        - name: entity_key_mode
          in: query
          description: Combine repeated entity keys with `or` or `and`.
          schema: { type: string, enum: [or, and] }
        - name: source_key
          in: query
          schema:
            type: array
            items:
              type: string
          example: ["fundbox"]
        - name: source_key_mode
          in: query
          description: Combine repeated source keys with `or` or `and`.
          schema: { type: string, enum: [or, and] }
        - name: source_record_type
          in: query
          schema:
            type: string
        - name: is_high_value
          in: query
          schema:
            type: boolean
        - name: is_high_risk
          in: query
          schema:
            type: boolean
        - name: has_phone
          in: query
          schema:
            type: boolean
        - name: has_email
          in: query
          schema:
            type: boolean
        - name: has_any_contact
          in: query
          schema:
            type: boolean
        - name: has_address
          in: query
          schema:
            type: boolean
        - name: has_bankruptcy_case
          in: query
          schema:
            type: boolean
        - name: has_any_match
          in: query
          schema:
            type: boolean
        - name: has_possible_match
          in: query
          schema:
            type: boolean
        - name: has_system_match
          in: query
          schema:
            type: boolean
        - name: crm_deal_count_min
          in: query
          schema:
            type: integer
            minimum: 0
        - name: crm_deal_count_max
          in: query
          schema:
            type: integer
            minimum: 0
        - name: addr_street
          in: query
          schema:
            type: string
        - name: addr_unit
          in: query
          schema:
            type: string
        - name: addr_city
          in: query
          schema:
            type: string
        - name: addr_postal
          in: query
          schema:
            type: string
        - name: addr_country
          in: query
          schema:
            type: string
        - name: updated_after
          in: query
          schema:
            type: string
        - name: updated_before
          in: query
          schema:
            type: string
        - name: has_dob
          in: query
          schema:
            type: boolean
        - name: dob_from
          in: query
          schema:
            type: string
        - name: dob_to
          in: query
          schema:
            type: string
        - name: dob_year
          in: query
          schema:
            type: string
        - name: dob_month
          in: query
          schema:
            type: string
        - name: dob_day
          in: query
          schema:
            type: string
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [preferred_full_name, preferred_phone, preferred_email, preferred_dob, preferred_nric, source_record_count, connection_count, entity_count, possible_match_count, system_match_count, order_count, crm_deal_count, bankruptcy_case_count, phone_confidence, updated_at, profile_completeness_score, relevance]
        - name: sort_order
          in: query
          schema:
            type: string
            enum: [asc, desc]
        - name: include_total
          in: query
          description: >-
            Whether to execute the exact count query. Defaults to true. When
            false, `meta.total_count` is null; use `meta.next_cursor` to continue.
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Paginated person list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListedPersonListResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /oauth2/v1/persons/{person_id}:
    get:
      tags: [OAuth2 Machine API]
      summary: Get canonical person detail (machine surface)
      operationId: getPersonMachine
      description: |
        Requires a HyperP OAuth2 client-credentials token with the `persons:read`
        scope; human Google ID tokens are rejected.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PersonId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Person detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonDetailResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
