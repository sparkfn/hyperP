  # â”€â”€ OAuth client management (admin only) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  /oauth2/v1/identity-links/events:
    get:
      tags: [OAuth2 Machine API]
      summary: Read an ordered immutable identity-link event window
      operationId: list_identity_link_events_machine
      description: >-
        OAuth-client-only synchronization feed. The first page freezes
        through_revision; authenticated opaque cursor pages retain that bound,
        recheck it against the current stream, and revisions are strictly
        contiguous. A detected gap requires snapshot recovery.
      security:
        - bearerAuth: [identity-links:read]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: after_revision
          in: query
          description: Exclusive global revision lower bound; cannot be combined with cursor.
          schema: {type: integer, minimum: 0}
        - name: cursor
          in: query
          description: Authenticated opaque events cursor; clients must not construct it.
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: Contiguous frozen event page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentityLinkEventsResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503':
          description: "identity_link_revision_gap when the immutable stream is non-contiguous."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponseEnvelope'}
  /oauth2/v1/identity-links/snapshot:
    get:
      tags: [OAuth2 Machine API]
      summary: Read a fixed-revision identity-link snapshot
      operationId: list_identity_link_snapshot_machine
      description: >-
        OAuth-client-only full-state recovery feed. The first page freezes
        snapshot_revision; authenticated opaque cursor pages recheck readiness and
        resolve each link at that same revision. Consumers recover by completing the
        snapshot and tailing events.
      security:
        - bearerAuth: [identity-links:read]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: cursor
          in: query
          description: Authenticated opaque snapshot cursor; clients must not construct it.
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: Fixed-revision snapshot page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentityLinkSnapshotResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503':
          description: "identity_link_snapshot_not_ready or identity_link_stream_unavailable."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponseEnvelope'}
  /v1/admin/oauth-clients:
    get:
      tags: [Admin]
      summary: List OAuth clients
      operationId: listOAuthClients
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OAuth clients, including disabled clients and secret metadata.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OAuthClient'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin]
      summary: Create an OAuth client
      operationId: createOAuthClient
      description: |
        Creates a machine OAuth client and returns the first `client_secret` once.
        Store the secret immediately; HyperP stores only a hashed secret value and
        returns only secret metadata after creation.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOAuthClientRequest'
            example:
              name: Fundbox Integration
              entity_key: fundbox-sg
              scopes: [persons:read]
              secret_expires_in_days: 365
      responses:
        '201':
          description: OAuth client created. The `client_secret` field is shown once only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthClientCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/admin/oauth-clients/{client_id}:
    delete:
      tags: [Admin]
      summary: Delete an OAuth client
      operationId: deleteOAuthClient
      description: Permanently deletes an OAuth client and its secrets.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OAuthClientId'
      responses:
        '204':
          description: OAuth client deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/admin/oauth-clients/{client_id}/disable:
    post:
      tags: [Admin]
      summary: Disable an OAuth client
      operationId: disableOAuthClient
      description: Disables an OAuth client so no secret for that client can obtain new tokens.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OAuthClientId'
      responses:
        '204':
          description: OAuth client disabled.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/admin/oauth-clients/{client_id}/secrets:
    post:
      tags: [Admin]
      summary: Create an OAuth client secret
      operationId: createOAuthClientSecret
      description: Rotates credentials by creating an additional one-time `client_secret` for an OAuth client.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OAuthClientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOAuthClientSecretRequest'
            example:
              expires_in_days: 365
      responses:
        '201':
          description: OAuth client secret created. The `client_secret` field is shown once only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthClientSecretCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/admin/oauth-clients/{client_id}/secrets/{secret_id}/revoke:
    post:
      tags: [Admin]
      summary: Revoke an OAuth client secret
      operationId: revokeOAuthClientSecret
      description: Revokes one OAuth client secret so it can no longer obtain new tokens.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OAuthClientId'
        - name: secret_id
          in: path
          required: true
          schema:
            type: string
          example: sec_2VhJd9uLS2wK8f3P
      responses:
        '204':
          description: OAuth client secret revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/review-cases:
    get:
      tags: [Review]
      summary: List review cases
      operationId: listReviewCases
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: queue_state
          in: query
          schema:
            $ref: '#/components/schemas/ReviewQueueState'
        - name: assigned_to
          in: query
          schema:
            type: string
        - name: person_id
          in: query
          description: >-
            Only cases whose match decision involves this person (either side).
          schema:
            type: string
        - name: q
          in: query
          description: >-
            Case-insensitive search (min 3 chars) over review_case_id, decision,
            engine_type, assigned_to, and the linked left/right person name,
            phone, and email.
          schema:
            type: string
            minLength: 3
        - name: priority_gte
          in: query
          schema:
            type: integer
        - name: priority_lte
          in: query
          schema:
            type: integer
        - name: decision
          in: query
          schema:
            type: string
        - name: engine_type
          in: query
          schema:
            type: string
        - name: confidence_gte
          in: query
          schema:
            type: number
            format: float
        - name: confidence_lte
          in: query
          schema:
            type: number
            format: float
        - name: created_after
          in: query
          schema:
            type: string
            format: date-time
        - name: created_before
          in: query
          schema:
            type: string
            format: date-time
        - name: sla_due_after
          in: query
          schema:
            type: string
            format: date-time
        - name: sla_due_before
          in: query
          schema:
            type: string
            format: date-time
        - name: overdue_sla
          in: query
          description: When true, only cases past their SLA and not yet resolved/cancelled.
          schema:
            type: boolean
        - name: resolved
          in: query
          description: >-
            True for closed cases (queue_state resolved or cancelled); false
            for unresolved cases (open, assigned, deferred).
          schema:
            type: boolean
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [priority, confidence, sla_due_at, created_at, updated_at, queue_state]
            default: priority
        - name: sort_order
          in: query
          schema:
            type: string
            enum: [asc, desc]
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Review cases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewCaseListResponseEnvelope'
  /v1/review-cases/{review_case_id}:
