openapi: 3.1.0
info:
  title: Profile Unifier API
  version: 1.0.0-draft
  summary: OpenAPI 3.1 contract for the profile unifier platform
  description: >
    Machine-readable representation of the main profile unifier API. This file
    covers the primary ingestion, search, person read, review workflow, merge,
    lock, and survivorship operations described in the companion API spec. It
    also documents the dedicated machine-facing OAuth2 surface mounted at
    `/oauth2/v1` (served externally under `/api/oauth2/v1`).

    Serving topology: the root app exposes only `/api/health`, the OAuth2 token
    flow (`/api/v1/oauth/{token,jwks}`), and the unauthenticated public pages
    (`/api/v1/public/...`). Every authenticated `/v1/...` path below is the
    canonical contract served through mounted sub-apps — the frontend mount is
    `/api/app/v2` (with `/v1` stripped, e.g. `/v1/persons` is served at
    `/api/app/v2/persons`) and, for the machine subset, `/api/oauth2/v1`.
servers:
  - url: https://api.example.internal
    description: Example internal deployment
  - url: http://localhost:3000
    description: Local development (disable auth via AUTH_ENABLED=false)
security:
  - bearerAuth: []
tags:
  - name: Ingestion
  - name: Persons
  - name: Review
  - name: Merge
  - name: Locks
  - name: Survivorship
  - name: OAuth
  - name: OAuth2 Machine API
    description: >
      Dedicated server-to-server surface mounted at /oauth2/v1. Token and JWKS
      endpoints mirror the root /v1/oauth flow; person endpoints are
      OAuth2-client-only and require the persons:read scope.
  - name: Admin
paths:
  /v1/ingest/{source_key}/records:
    post:
      tags: [Ingestion]
      summary: Submit normalized source records for ingestion
      operationId: ingestRecords
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SourceKey'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestRecordsRequest'
      responses:
        '200':
          description: Records accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestRecordsResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/ingest/{source_key}/runs:
    post:
      tags: [Ingestion]
      summary: Create an ingest run
      operationId: createIngestRun
      parameters:
        - $ref: '#/components/parameters/SourceKey'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIngestRunRequest'
      responses:
        '200':
          description: Ingest run created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestRunResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/ingest/{source_key}/runs/{ingest_run_id}:
    patch:
      tags: [Ingestion]
      summary: Update ingest run status
      operationId: updateIngestRun
      parameters:
        - $ref: '#/components/parameters/SourceKey'
        - $ref: '#/components/parameters/IngestRunId'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIngestRunRequest'
      responses:
        '200':
          description: Ingest run updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestRunResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/persons/search:
    get:
      tags: [Persons]
      summary: List / search canonical persons
      operationId: searchPersons
      description: |
        Returns a paginated list of canonical persons with cursor-based pagination.
        All filters are applied as AND conditions. Results are sorted by
        `created_at DESC` unless `sort_by` is specified.

        **MCP tool call example:**

        ```python
        result = await client.tools.call("hyperP_search_persons", {
          "limit": 20,
          "status": "active",
          "q": "Tan Wei Ming",
          "sort_by": "preferred_full_name",
          "sort_order": "asc"
        })
        # Returns: { data: [ListedPerson], meta: { total_count: N, next_cursor: "MTA=" } }
        ```
      security:
        - bearerAuth: []
      parameters:
        - name: identifier_type
          in: query
          description: |
            Filter by identifier type. When combined with `value`, resolves to a
            specific person with that exact identifier.
          schema:
            $ref: '#/components/schemas/IdentifierType'
          example: phone
        - name: value
          in: query
          description: |
            Filter by exact identifier value. Requires `identifier_type`.
            Case-insensitive exact match on the normalized identifier value.
          schema:
            type: string
          example: "+65 9123 4567"
        - name: q
          in: query
          description: |
            Full-text search across `preferred_full_name`, `preferred_nric`,
            `preferred_email`, and `preferred_phone`. Minimum 3 characters.
            Matches are returned regardless of position in string.
          schema:
            type: string
          example: "Tan Wei"
        - name: source_system
          in: query
          description: Filter to persons with at least one source record from this source.
          schema:
            type: string
          example: "fundbox-pos"
        - name: entity_key_mode
          in: query
          description: >-
            How to combine multiple `entity_key` values. `or` means any match;
            `and` means the person must be associated with all supplied entities.
          schema:
            type: string
            enum: [or, and]
            default: or
        - name: source_key
          in: query
          description: Filter to persons with source records from any of these source systems.
          schema:
            type: array
            items:
              type: string
          example: ["fundbox-pos"]
        - name: source_key_mode
          in: query
          description: >-
            How to combine multiple `source_key` values. `or` means any match;
            `and` means the person must have source records from all supplied systems.
          schema:
            type: string
            enum: [or, and]
            default: or
        - name: source_record_type
          in: query
          description: Filter by source record type.
          schema:
            type: string
            enum: [identity, bankruptcy, relationship, rental_flat, conversation, sales]
        - name: is_high_value
          in: query
          description: Filter by high-value flag.
          schema:
            type: boolean
        - name: dob_from
          in: query
          description: Inclusive lower bound on date of birth (YYYY-MM-DD).
          schema:
            type: string
            format: date
          example: "1980-01-01"
        - name: dob_to
          in: query
          description: Inclusive upper bound on date of birth (YYYY-MM-DD).
          schema:
            type: string
            format: date
          example: "1999-12-31"
        - name: sort_by
          in: query
          description: |
            Sort column. Supported values: `preferred_full_name`, `created_at`,
            `updated_at`, `identifier_count`, `order_count`.
          schema:
            type: string
            enum: [preferred_full_name, created_at, updated_at, identifier_count, order_count]
        - name: sort_order
          in: query
          description: Sort direction. Defaults to `desc`.
          schema:
            type: string
            enum: [asc, desc]
          example: asc
        - name: cursor
          in: query
          description: |
            Opaque pagination cursor returned in `meta.next_cursor` of the
            previous response. Omit for the first page.
          schema:
            type: string
          example: "MTA="
        - name: limit
          in: query
          description: |
            Number of results per page (1–100). Defaults to 20.
            Request one extra row to detect `has_more`.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
      responses:
        '200':
          description: Paginated list of persons matching the query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonSearchResponseEnvelope'
              example:
                data:
                  - id: "c9f2e8d1-4b3a-4f5e-8c7d-2a6b9e4f8c1a"
                    display_name: "Tan Wei Ming"
                    preferred_full_name: "Tan Wei Ming"
                    preferred_email: "tan.weiming@example.com"
                    preferred_phone: "+65 9123 4567"
                    preferred_nric: null
                    status: "active"
                    entity_count: 1
                    identifier_count: 2
                    order_count: 0
                    entities:
                      - entity_key: "fundbox-sg"
                        display_name: "Fundbox Singapore"
                        entity_type: "pos"
                        country_code: "SG"
                        is_active: true
                        source_record_count: 14
                meta:
                  request_id: "req_abc123"
                  total_count: 47
                  next_cursor: "MTA="
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/persons/{person_id}:
    get:
      tags: [Persons]
      summary: Get canonical person detail
      operationId: getPerson
      parameters:
        - $ref: '#/components/parameters/PersonId'
        - $ref: '#/components/parameters/RequestId'
        - name: include
          in: query
          description: Comma-separated expansions
          schema:
            type: string
      responses:
        '200':
          description: Person detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonDetailResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PersonNotFound'
  /v1/persons/{person_id}/source-records:
    get:
      tags: [Persons]
      summary: Get effective-active source records linked to a person
      operationId: getPersonSourceRecords
      parameters:
        - $ref: '#/components/parameters/PersonId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: >-
            Active source records for the person, including temporary legacy
            effective-active records during lifecycle migration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceRecordListResponseEnvelope'
        '404':
          $ref: '#/components/responses/PersonNotFound'
  /v1/persons/{person_id}/connections:
    get:
      tags: [Persons]
      summary: Get persons connected through shared identifiers and addresses
      operationId: getPersonConnections
      parameters:
        - $ref: '#/components/parameters/PersonId'
        - $ref: '#/components/parameters/RequestId'
        - name: connection_type
          in: query
          schema:
            type: string
            enum: [identifier, address, all]
            default: all
        - name: identifier_type
          in: query
          schema:
            $ref: '#/components/schemas/IdentifierType'
        - name: max_hops
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 3
            default: 1
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Connected persons via shared identifiers and/or addresses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonConnectionsResponseEnvelope'
        '404':
          $ref: '#/components/responses/PersonNotFound'
  /v1/persons/{person_id}/relationships:
    get:
      tags: [Persons]
      summary: Get explicit typed relationships for a person (post-MVP)
      operationId: getPersonRelationships
      parameters:
        - $ref: '#/components/parameters/PersonId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Explicit relationships for the person
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicSuccessEnvelope'
        '404':
          $ref: '#/components/responses/PersonNotFound'
  /v1/persons/{person_id}/audit:
    get:
      tags: [Persons]
      summary: Get audit history for a person
      operationId: getPersonAudit
      parameters:
        - $ref: '#/components/parameters/PersonId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Audit history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventListResponseEnvelope'
        '404':
          $ref: '#/components/responses/PersonNotFound'
  /v1/persons/{person_id}/matches:
    get:
      tags: [Persons]
      summary: Get recent match decisions related to a person
      operationId: getPersonMatches
      parameters:
        - $ref: '#/components/parameters/PersonId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Match decisions for the person
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchDecisionListResponseEnvelope'
        '404':
          $ref: '#/components/responses/PersonNotFound'
  # ── OAuth client credentials ────────────────────────────────────────────────
  /v1/oauth/token:
    post:
      tags: [OAuth]
      summary: Issue an OAuth2 client-credentials access token
      operationId: createOAuthToken
      description: |
        Exchanges an OAuth client ID and one active client secret for a short-lived
        HyperP-issued RS256 JWT access token. This endpoint uses OAuth-compatible
        top-level JSON responses rather than the standard HyperP response envelope.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAuthTokenRequest'
            encoding:
              grant_type:
                style: form
              client_id:
                style: form
              client_secret:
                style: form
              scope:
                style: form
            example:
              grant_type: client_credentials
              client_id: hpc_2VhJd9uLS2wK8f3P
              client_secret: hps_Yh7j...redacted
              scope: persons:read
      responses:
        '200':
          description: |
            Access token issued. Response includes `Cache-Control: no-store` and
            `Pragma: no-cache` headers.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenResponse'
        '400':
          description: OAuth token request failed with `invalid_request`, `invalid_scope`, or `unsupported_grant_type`.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthErrorResponse'
        '401':
          description: OAuth token request failed with `invalid_client`.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthErrorResponse'
  /v1/oauth/jwks:
    get:
      tags: [OAuth]
      summary: Return public signing keys for HyperP-issued access tokens
      operationId: getOAuthJwks
      security: []
      responses:
        '200':
          description: JSON Web Key Set containing active OAuth signing keys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonWebKeySet'
  # ── Machine OAuth2 API surface (mounted at /oauth2/v1) ──────────────────────
  # Dedicated server-to-server mount, served externally at /api/oauth2/v1. The
  # token/JWKS endpoints mirror the root /v1/oauth flow without the redundant
  # /oauth path segment; the person endpoints are OAuth2-client-only (human
  # Google tokens are rejected) and require the persons:read scope.
  /oauth2/v1/token:
    post:
      tags: [OAuth2 Machine API]
      summary: Issue an OAuth2 client-credentials access token (machine surface)
      operationId: createOAuthTokenMachine
      description: |
        Identical contract to `POST /v1/oauth/token`, exposed on the dedicated
        machine mount. Uses OAuth-compatible top-level JSON responses rather than
        the standard HyperP envelope. Response carries `Cache-Control: no-store`
        and `Pragma: no-cache`.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAuthTokenRequest'
            encoding:
              grant_type:
                style: form
              client_id:
                style: form
              client_secret:
                style: form
              scope:
                style: form
      responses:
        '200':
          description: Access token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenResponse'
        '400':
          description: Failed with `invalid_request`, `invalid_scope`, or `unsupported_grant_type`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthErrorResponse'
        '401':
          description: Failed with `invalid_client`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthErrorResponse'
  /oauth2/v1/jwks:
    get:
      tags: [OAuth2 Machine API]
      summary: Public signing keys for HyperP-issued access tokens (machine surface)
      operationId: getOAuthJwksMachine
      description: Identical to `GET /v1/oauth/jwks`, exposed on the machine mount.
      security: []
      responses:
        '200':
          description: JSON Web Key Set containing active OAuth signing keys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonWebKeySet'
  /oauth2/v1/persons:
    get:
      tags: [OAuth2 Machine API]
      summary: List canonical persons (machine surface)
      operationId: listPersonsMachine
      description: |
        Paginated canonical person list for machine callers, with the same
        filters and sorting as the authenticated person list. Requires a HyperP
        OAuth2 client-credentials token with the `persons:read` scope; human
        Google ID tokens are rejected.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: q
          in: query
          description: |
            Free-text search (min 3 chars) across `preferred_full_name`,
            `preferred_nric`, `preferred_email`, and `preferred_phone`.
          schema:
            type: string
          example: "Tan Wei Ming"
        - name: cursor
          in: query
          description: Opaque pagination cursor.
          schema:
            type: string
        - name: limit
          in: query
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: entity_key
          in: query
          description: Filter to persons associated with this entity key. Repeatable.
          schema:
            type: array
            items:
              type: string
          example: ["fundbox-sg"]
        - name: source_key
          in: query
          description: Filter to persons with at least one source record from this source. Repeatable.
          schema:
            type: array
            items:
              type: string
          example: ["fundbox_consumer_backend"]
        - name: source_record_type
          in: query
          description: Filter by linked source-record subtype.
          schema:
            type: string
        - name: is_high_value
          in: query
          description: Filter by high-value flag.
          schema:
            type: boolean
        - name: is_high_risk
          in: query
          description: Filter by high-risk flag.
          schema:
            type: boolean
        - name: has_phone
          in: query
          description: Filter by presence of a phone identifier.
          schema:
            type: boolean
        - name: has_email
          in: query
          description: Filter by presence of an email identifier.
          schema:
            type: boolean
        - name: has_any_contact
          in: query
          description: Filter by presence of any contact identifier (phone or email).
          schema:
            type: boolean
        - name: has_address
          in: query
          description: Filter by presence of a linked address.
          schema:
            type: boolean
        - name: has_bankruptcy_case
          in: query
          description: Filter by presence of a bankruptcy case.
          schema:
            type: boolean
        - name: has_any_match
          in: query
          description: Filter by presence of any candidate match (identifier overlap or active system review case).
          schema:
            type: boolean
        - name: has_possible_match
          in: query
          description: Filter by presence of a shared-identifier candidate person.
          schema:
            type: boolean
        - name: has_system_match
          in: query
          description: Filter by presence of an active system (auto) match review case.
          schema:
            type: boolean
        - name: addr_street
          in: query
          description: Filter by normalized street address (case-insensitive substring).
          schema:
            type: string
        - name: addr_unit
          in: query
          description: Filter by unit/floor.
          schema:
            type: string
        - name: addr_city
          in: query
          description: Filter by city.
          schema:
            type: string
        - name: addr_postal
          in: query
          description: Filter by postal code.
          schema:
            type: string
        - name: addr_country
          in: query
          description: Filter by country code.
          schema:
            type: string
        - name: updated_after
          in: query
          description: Inclusive lower bound on person `updated_at` (ISO-8601).
          schema:
            type: string
            format: date-time
        - name: updated_before
          in: query
          description: Inclusive upper bound on person `updated_at` (ISO-8601).
          schema:
            type: string
            format: date-time
        - name: has_dob
          in: query
          description: Filter by presence of a date of birth.
          schema:
            type: boolean
        - name: dob_from
          in: query
          description: Inclusive lower bound on date of birth (YYYY-MM-DD).
          schema:
            type: string
            format: date
        - name: dob_to
          in: query
          description: Inclusive upper bound on date of birth (YYYY-MM-DD).
          schema:
            type: string
            format: date
        - name: dob_year
          in: query
          description: Exact year of birth.
          schema:
            type: integer
        - name: dob_month
          in: query
          description: Exact month of birth (1-12).
          schema:
            type: integer
            minimum: 1
            maximum: 12
        - name: dob_day
          in: query
          description: Exact day of birth (1-31).
          schema:
            type: integer
            minimum: 1
            maximum: 31
        - name: sort_by
          in: query
          description: Sort column.
          schema:
            type: string
            enum:
              [
                preferred_full_name,
                preferred_phone,
                preferred_email,
                preferred_dob,
                preferred_nric,
                source_record_count,
                connection_count,
                entity_count,
                possible_match_count,
                system_match_count,
                order_count,
                bankruptcy_case_count,
                phone_confidence,
                updated_at,
                profile_completeness_score,
                relevance,
              ]
        - name: sort_order
          in: query
          description: Sort direction. Defaults to `desc`.
          schema:
            type: string
            enum: [asc, desc]
      responses:
        '200':
          description: Paginated person list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonSearchResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /oauth2/v1/persons/{person_id}:
    get:
      tags: [OAuth2 Machine API]
      summary: Get canonical person detail (machine surface)
      operationId: getPersonMachine
      description: |
        Requires a HyperP OAuth2 client-credentials token with the `persons:read`
        scope; human Google ID tokens are rejected.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PersonId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Person detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonDetailResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PersonNotFound'
  # ── OAuth client management (admin only) ────────────────────────────────────
  /v1/admin/oauth-clients:
    get:
      tags: [Admin]
      summary: List OAuth clients
      operationId: listOAuthClients
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OAuth clients, including disabled clients and secret metadata.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OAuthClient'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin]
      summary: Create an OAuth client
      operationId: createOAuthClient
      description: |
        Creates a machine OAuth client and returns the first `client_secret` once.
        Store the secret immediately; HyperP stores only a hashed secret value and
        returns only secret metadata after creation.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOAuthClientRequest'
            example:
              name: Fundbox Integration
              entity_key: fundbox-sg
              scopes: [persons:read]
              secret_expires_in_days: 365
      responses:
        '201':
          description: OAuth client created. The `client_secret` field is shown once only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthClientCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/admin/oauth-clients/{client_id}:
    delete:
      tags: [Admin]
      summary: Delete an OAuth client
      operationId: deleteOAuthClient
      description: Permanently deletes an OAuth client and its secrets.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OAuthClientId'
      responses:
        '204':
          description: OAuth client deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/admin/oauth-clients/{client_id}/disable:
    post:
      tags: [Admin]
      summary: Disable an OAuth client
      operationId: disableOAuthClient
      description: Disables an OAuth client so no secret for that client can obtain new tokens.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OAuthClientId'
      responses:
        '204':
          description: OAuth client disabled.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/admin/oauth-clients/{client_id}/secrets:
    post:
      tags: [Admin]
      summary: Create an OAuth client secret
      operationId: createOAuthClientSecret
      description: Rotates credentials by creating an additional one-time `client_secret` for an OAuth client.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OAuthClientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOAuthClientSecretRequest'
            example:
              expires_in_days: 365
      responses:
        '201':
          description: OAuth client secret created. The `client_secret` field is shown once only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthClientSecretCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/admin/oauth-clients/{client_id}/secrets/{secret_id}/revoke:
    post:
      tags: [Admin]
      summary: Revoke an OAuth client secret
      operationId: revokeOAuthClientSecret
      description: Revokes one OAuth client secret so it can no longer obtain new tokens.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OAuthClientId'
        - name: secret_id
          in: path
          required: true
          schema:
            type: string
          example: sec_2VhJd9uLS2wK8f3P
      responses:
        '204':
          description: OAuth client secret revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/review-cases:
    get:
      tags: [Review]
      summary: List review cases
      operationId: listReviewCases
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: queue_state
          in: query
          schema:
            $ref: '#/components/schemas/ReviewQueueState'
        - name: assigned_to
          in: query
          schema:
            type: string
        - name: person_id
          in: query
          description: >-
            Only cases whose match decision involves this person (either side).
          schema:
            type: string
        - name: q
          in: query
          description: >-
            Case-insensitive search (min 3 chars) over review_case_id, decision,
            engine_type, assigned_to, and the linked left/right person name,
            phone, and email.
          schema:
            type: string
            minLength: 3
        - name: priority_gte
          in: query
          schema:
            type: integer
        - name: priority_lte
          in: query
          schema:
            type: integer
        - name: decision
          in: query
          schema:
            type: string
        - name: engine_type
          in: query
          schema:
            type: string
        - name: confidence_gte
          in: query
          schema:
            type: number
            format: float
        - name: confidence_lte
          in: query
          schema:
            type: number
            format: float
        - name: created_after
          in: query
          schema:
            type: string
            format: date-time
        - name: created_before
          in: query
          schema:
            type: string
            format: date-time
        - name: sla_due_after
          in: query
          schema:
            type: string
            format: date-time
        - name: sla_due_before
          in: query
          schema:
            type: string
            format: date-time
        - name: overdue_sla
          in: query
          description: When true, only cases past their SLA and not yet resolved/cancelled.
          schema:
            type: boolean
        - name: resolved
          in: query
          description: >-
            True for closed cases (queue_state resolved or cancelled); false
            for unresolved cases (open, assigned, deferred).
          schema:
            type: boolean
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [priority, confidence, sla_due_at, created_at, updated_at, queue_state]
            default: priority
        - name: sort_order
          in: query
          schema:
            type: string
            enum: [asc, desc]
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Review cases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewCaseListResponseEnvelope'
  /v1/review-cases/{review_case_id}:
    get:
      tags: [Review]
      summary: Get review case detail
      operationId: getReviewCase
      parameters:
        - $ref: '#/components/parameters/ReviewCaseId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Review case detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewCaseDetailResponseEnvelope'
        '404':
          $ref: '#/components/responses/ReviewCaseNotFound'
  /v1/review-cases/{review_case_id}/assign:
    post:
      tags: [Review]
      summary: Assign a review case
      operationId: assignReviewCase
      parameters:
        - $ref: '#/components/parameters/ReviewCaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignReviewCaseRequest'
      responses:
        '200':
          description: Review case assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewCaseAssignResponseEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/review-cases/{review_case_id}/unassign:
    post:
      tags: [Review]
      summary: Unassign a review case
      operationId: unassignReviewCase
      parameters:
        - $ref: '#/components/parameters/ReviewCaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Review case unassigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewCaseAssignResponseEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/review-cases/{review_case_id}/actions:
    post:
      tags: [Review]
      summary: Submit a review action
      operationId: createReviewAction
      parameters:
        - $ref: '#/components/parameters/ReviewCaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewActionRequest'
      responses:
        '200':
          description: Review action applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewActionResponseEnvelope'
        '404':
          $ref: '#/components/responses/ReviewCaseNotFound'
        '409':
          $ref: '#/components/responses/MergeBlocked'
  /v1/persons/manual-merge:
    post:
      tags: [Merge]
      summary: Manually merge two canonical persons
      operationId: manualMergePersons
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualMergeRequest'
      responses:
        '200':
          description: Merge completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualMergeResponseEnvelope'
        '409':
          $ref: '#/components/responses/MergeBlocked'
  /v1/persons/unmerge:
    post:
      tags: [Merge]
      summary: Undo a prior merge
      operationId: unmergePersons
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnmergeRequest'
      responses:
        '200':
          description: Unmerge completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnmergeResponseEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/locks/person-pair:
    post:
      tags: [Locks]
      summary: Create a persistent person-pair lock
      operationId: createPersonPairLock
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePersonPairLockRequest'
      responses:
        '200':
          description: Lock created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonPairLockResponseEnvelope'
  /v1/locks/{lock_id}:
    delete:
      tags: [Locks]
      summary: Remove an existing lock
      operationId: deleteLock
      parameters:
        - $ref: '#/components/parameters/LockId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Lock deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicSuccessEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/persons/{person_id}/golden-profile/recompute:
    post:
      tags: [Survivorship]
      summary: Recompute golden profile for a person
      operationId: recomputeGoldenProfile
      parameters:
        - $ref: '#/components/parameters/PersonId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Recompute triggered or completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicSuccessEnvelope'
  /v1/persons/{person_id}/survivorship-overrides:
    post:
      tags: [Survivorship]
      summary: Create or replace a survivorship override
      operationId: createSurvivorshipOverride
      parameters:
        - $ref: '#/components/parameters/PersonId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SurvivorshipOverrideRequest'
      responses:
        '200':
          description: Override stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicSuccessEnvelope'
  /v1/ingest/runs/{ingest_run_id}:
    get:
      tags: [Admin]
      summary: Get ingest run status
      operationId: getIngestRun
      parameters:
        - $ref: '#/components/parameters/IngestRunId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Ingest run detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestRunResponseEnvelope'
  /v1/source-systems:
    get:
      tags: [Admin]
      summary: List configured source systems
      operationId: listSourceSystems
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Source systems
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceSystemListResponseEnvelope'
  /v1/source-systems/{source_key}/field-trust:
    get:
      tags: [Admin]
      summary: Get field-level trust for a source
      operationId: getSourceFieldTrust
      parameters:
        - $ref: '#/components/parameters/SourceKey'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Field-level trust config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldTrustListResponseEnvelope'
    patch:
      tags: [Admin]
      summary: Update field-level trust for a source
      operationId: patchSourceFieldTrust
      parameters:
        - $ref: '#/components/parameters/SourceKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchFieldTrustRequest'
      responses:
        '200':
          description: Field-level trust updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldTrustListResponseEnvelope'
  /v1/events:
    get:
      tags: [Admin]
      summary: Poll for identity change events
      operationId: listEvents
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: since
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: event_type
          in: query
          schema:
            type: string
            enum:
              - person_created
              - person_merged
              - person_unmerged
              - golden_profile_updated
              - review_case_resolved
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Events since the given timestamp
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicSuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bearer JWT accepted by HyperP APIs. Human users send Google OAuth 2.0 ID
        tokens obtained through the browser/NextAuth flow. Machine callers send
        HyperP-issued OAuth2 client-credentials access tokens from
        `POST /v1/oauth/token`.
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
    SourceKey:
      name: source_key
      in: path
      required: true
      schema:
        type: string
    PersonId:
      name: person_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReviewCaseId:
      name: review_case_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IngestRunId:
      name: ingest_run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LockId:
      name: lock_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OAuthClientId:
      name: client_id
      in: path
      required: true
      schema:
        type: string
      example: hpc_2VhJd9uLS2wK8f3P
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseEnvelope'
    UnprocessableEntity:
      description: Request body or parameters failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseEnvelope'
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseEnvelope'
    Forbidden:
      description: Caller does not have the required role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseEnvelope'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseEnvelope'
    Conflict:
      description: Request conflicts with current state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseEnvelope'
    PersonNotFound:
      description: Person was not found
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponseEnvelope'
    ReviewCaseNotFound:
      description: Review case was not found
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponseEnvelope'
    MergeBlocked:
      description: Merge blocked by lock or hard policy
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseEnvelope'
  schemas:
    Meta:
      type: object
      properties:
        request_id:
          type: string
        next_cursor:
          type:
            - string
            - 'null'
      required: [request_id]
      additionalProperties: false
    ErrorObject:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
      required: [code, message, details]
      additionalProperties: false
    ErrorResponseEnvelope:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorObject'
        meta:
          $ref: '#/components/schemas/Meta'
      required: [error, meta]
      additionalProperties: false
    IdentifierType:
      type: string
      enum:
        - government_id_hash
        - phone
        - email
        - external_customer_id
        - membership_id
        - crm_contact_id
        - loyalty_id
        - custom
    PersonStatus:
      type: string
      enum: [active, merged, suppressed]
    ReviewQueueState:
      type: string
      enum: [open, assigned, deferred, resolved, cancelled]
    ReviewResolution:
      type: string
      enum: [merge, reject, manual_no_match, cancelled_superseded]
    ReviewActionType:
      type: string
      enum: [merge, reject, defer, escalate, manual_no_match]
    PersonSummary:
      type: object
      properties:
        person_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/PersonStatus'
        is_high_value:
          type: boolean
        is_high_risk:
          type: boolean
        golden_profile:
          $ref: '#/components/schemas/GoldenProfile'
        source_record_count:
          type: integer
        identifier_counts:
          type: object
          additionalProperties:
            type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - person_id
        - status
        - is_high_value
        - is_high_risk
        - golden_profile
        - source_record_count
        - identifier_counts
        - created_at
        - updated_at
      additionalProperties: false
    AddressSummary:
      type: object
      properties:
        address_id:
          type: string
          format: uuid
        unit_number:
          type:
            - string
            - 'null'
        street_number:
          type:
            - string
            - 'null'
        street_name:
          type:
            - string
            - 'null'
        city:
          type:
            - string
            - 'null'
        postal_code:
          type:
            - string
            - 'null'
        country_code:
          type:
            - string
            - 'null'
        normalized_full:
          type:
            - string
            - 'null'
      required: [address_id]
      additionalProperties: false
    QualityFlag:
      type: string
      enum:
        - valid
        - invalid_format
        - placeholder_value
        - shared_suspected
        - stale
        - source_untrusted
        - partial_parse
    GoldenProfile:
      type: object
      properties:
        preferred_full_name:
          type:
            - string
            - 'null'
        preferred_phone:
          type:
            - string
            - 'null'
        preferred_email:
          type:
            - string
            - 'null'
          format: email
        preferred_dob:
          type:
            - string
            - 'null'
          format: date
        preferred_address:
          oneOf:
            - $ref: '#/components/schemas/AddressSummary'
            - type: 'null'
      additionalProperties: true
    SourceRecord:
      type: object
      properties:
        source_record_pk:
          type: string
        source_system:
          type: string
        source_record_id:
          type: string
        source_record_version:
          type:
            - string
            - 'null'
        entity_key:
          type: [string, 'null']
        entity_display_name:
          type: [string, 'null']
        record_type:
          type: string
          enum: [identity, bankruptcy, rental_flat, relationship, conversation, sales]
        lifecycle_status:
          type: string
          description: >-
            Accepted-version lifecycle authority. link_status independently
            describes domain-link progress. Legacy effective-active records are
            normalized to active in API responses during migration.
          enum: [active, pending_review, superseded, rejected, link_failed]
        extraction_confidence:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 1
        extraction_method:
          type: [string, 'null']
        link_status:
          type: string
        linked_person_id:
          type:
            - string
            - 'null'
        observed_at:
          type: string
        ingested_at:
          type: string
        conversation_ref:
          type: [object, 'null']
          additionalProperties: true
        raw_payload:
          type: [object, 'null']
          additionalProperties: true
        normalized_payload:
          type: [object, 'null']
          additionalProperties: true
      required:
        - source_record_pk
        - source_system
        - source_record_id
        - record_type
        - lifecycle_status
        - link_status
        - observed_at
        - ingested_at
      additionalProperties: false
    ChatMessage:
      type: object
      properties:
        timestamp:
          type: string
        timestamp_display:
          type: string
        speaker:
          type: string
        phone:
          type: [string, 'null']
        role:
          type: [string, 'null']
        text:
          type: string
      required: [timestamp, timestamp_display, speaker, text]
      additionalProperties: false
    SourceRecordView:
      type: object
      properties:
        source_record_pk:
          type: string
        source_system:
          type: string
        source_record_id:
          type: string
        source_record_version:
          type: [string, 'null']
        entity_key:
