      type: object
      properties:
        grant_type:
          type: string
          const: client_credentials
        client_id:
          type: string
          example: hpc_2VhJd9uLS2wK8f3P
        client_secret:
          type: string
          format: password
          example: hps_Yh7j...redacted
        scope:
          type: string
          description: Optional space-delimited subset of scopes assigned to the client.
          example: persons:read
      required: [grant_type, client_id, client_secret]
      additionalProperties: false
    OAuthTokenResponse:
      type: object
      properties:
        access_token:
          type: string
          description: HyperP-issued RS256 JWT access token.
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          minimum: 1
          description: Access token lifetime in seconds.
          example: 900
        scope:
          type: string
          description: Space-delimited scopes granted to the access token.
          example: persons:read
      required: [access_token, token_type, expires_in, scope]
      additionalProperties: false
    OAuthErrorResponse:
      type: object
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_client
            - invalid_scope
            - unsupported_grant_type
        error_description:
          type: string
      required: [error, error_description]
      additionalProperties: false
    JsonWebKey:
      type: object
      properties:
        kty:
          type: string
          const: RSA
        use:
          type: string
          const: sig
        kid:
          type: string
        alg:
          type: string
          const: RS256
        n:
          type: string
        e:
          type: string
      required: [kty, use, kid, alg, n, e]
      additionalProperties: false
    JsonWebKeySet:
      type: object
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/JsonWebKey'
      required: [keys]
      additionalProperties: false
    OAuthClientSecret:
      type: object
      description: Stored metadata for one OAuth client secret; the plain secret is never stored or returned after creation.
      properties:
        secret_id:
          type: string
          example: sec_2VhJd9uLS2wK8f3P
        secret_prefix:
          type: string
          description: Non-secret prefix used for human identification.
          example: hps_Yh7j
        created_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
      required: [secret_id, secret_prefix]
      additionalProperties: false
    OAuthClient:
      type: object
      description: Machine OAuth client metadata.
      properties:
        client_id:
          type: string
          example: hpc_2VhJd9uLS2wK8f3P
        name:
          type: string
          example: Fundbox Integration
        entity_key:
          type: string
          nullable: true
          description: If set, tokens for this client are scoped to this entity.
          example: fundbox-sg
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/OAuthScope'
          minItems: 1
          example: [persons:read]
        created_by:
          type: string
          format: email
          description: Email of the admin who created this client.
        created_at:
          type: string
          format: date-time
          nullable: true
        disabled_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
        secrets:
          type: array
          items:
            $ref: '#/components/schemas/OAuthClientSecret'
      required: [client_id, name, scopes, created_by, secrets]
      additionalProperties: false
    CreateOAuthClientRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          example: Fundbox Integration
        entity_key:
          type: string
          nullable: true
          description: Scope token claims and authorization checks to this entity. Null = cross-entity.
          example: fundbox-sg
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/OAuthScope'
          minItems: 1
          example: [persons:read]
        secret_expires_in_days:
          type: integer
          nullable: true
          minimum: 1
          maximum: 730
          default: 365
          description: Initial secret expiry in days. Null = no expiry.
          example: 365
      required: [name, scopes]
      additionalProperties: false
    OAuthClientCreated:
      type: object
      description: OAuth client creation response; the `client_secret` is shown once only.
      properties:
        client_id:
          type: string
          example: hpc_2VhJd9uLS2wK8f3P
        client_secret:
          type: string
          description: The full client secret. Store this immediately; it will never be shown again.
          example: hps_Yh7j...redacted
        secret_id:
          type: string
          example: sec_2VhJd9uLS2wK8f3P
        secret_prefix:
          type: string
          description: Non-secret prefix used for human identification.
          example: hps_Yh7j
        name:
          type: string
          example: Fundbox Integration
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/OAuthScope'
        secret_expires_at:
          type: string
          format: date-time
          nullable: true
      required: [client_id, client_secret, secret_id, secret_prefix, name, scopes]
      additionalProperties: false
    CreateOAuthClientSecretRequest:
      type: object
      properties:
        expires_in_days:
          type: integer
          nullable: true
          minimum: 1
          maximum: 730
          default: 365
          description: Secret expiry in days. Null = no expiry.
          example: 365
      additionalProperties: false
    OAuthClientSecretCreated:
      type: object
      description: Secret rotation response; the `client_secret` is shown once only.
      properties:
        client_id:
          type: string
          example: hpc_2VhJd9uLS2wK8f3P
        client_secret:
          type: string
          description: The full client secret. Store this immediately; it will never be shown again.
          example: hps_B3bQ...redacted
        secret_id:
          type: string
          example: sec_7QaLd9uLS2wK8f3P
        secret_prefix:
          type: string
          description: Non-secret prefix used for human identification.
          example: hps_B3bQ
        expires_at:
          type: string
          format: date-time
          nullable: true
      required: [client_id, client_secret, secret_id, secret_prefix]
      additionalProperties: false
