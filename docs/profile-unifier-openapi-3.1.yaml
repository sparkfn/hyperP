openapi: 3.1.0
info:
  title: Profile Unifier API
  version: 1.0.0-draft
  summary: OpenAPI 3.1 contract for the profile unifier platform
  description: >
    Machine-readable representation of the main profile unifier API. This file
    covers the primary ingestion, search, person read, review workflow, merge,
    lock, and survivorship operations described in the companion API spec. It
    also documents the dedicated machine-facing OAuth2 surface mounted at
    `/oauth2/v1` (served externally under `/api/oauth2/v1`).

    Serving topology: the root app exposes only `/api/health`, the OAuth2 token
    flow (`/api/v1/oauth/{token,jwks}`), and the unauthenticated public pages
    (`/api/v1/public/...`). Every authenticated `/v1/...` path below is the
    canonical contract served through mounted sub-apps â€” the frontend mount is
    `/api/app/v2` (with `/v1` stripped, e.g. `/v1/persons` is served at
    `/api/app/v2/persons`) and, for the machine subset, `/api/oauth2/v1`.
    Person profile-analysis paths are an authenticated human frontend surface
    only: they run under `/api/app/v2/persons/...` and are excluded from the
    root/public app and the `/oauth2/v1` machine subset.
servers:
  - url: https://api.example.internal
    description: Example internal deployment
  - url: http://localhost:3000
    description: Local development (disable auth via AUTH_ENABLED=false)
security:
  - bearerAuth: []
tags:
  - name: Ingestion
  - name: Persons
  - name: Entities
  - name: Review
  - name: Merge
  - name: Locks
  - name: Survivorship
  - name: OAuth
  - name: OAuth2 Machine API
    description: >
      Dedicated server-to-server surface mounted at /oauth2/v1. Token and JWKS
      endpoints mirror the root /v1/oauth flow; person endpoints are
      OAuth2-client-only and require the persons:read scope.
  - name: Admin
paths:
  /v1/ingest/{source_key}/records:
    post:
      tags: [Ingestion]
      summary: Submit normalized source records for ingestion
      operationId: ingestRecords
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SourceKey'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestRecordsRequest'
      responses:
        '200':
          description: Records accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestRecordsResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/ingest/{source_key}/runs:
    post:
      tags: [Ingestion]
      summary: Create an ingest run
      description: Creates the run metadata and enqueues the ingestion worker task.
      operationId: createIngestRun
      parameters:
        - $ref: '#/components/parameters/SourceKey'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIngestRunRequest'
      responses:
        '201':
          description: Ingest run created and queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestRunResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/ingest/{source_key}/runs/{ingest_run_id}:
    patch:
      tags: [Ingestion]
      summary: Update ingest run status
      operationId: updateIngestRun
      parameters:
        - $ref: '#/components/parameters/SourceKey'
        - $ref: '#/components/parameters/IngestRunId'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIngestRunRequest'
      responses:
        '200':
          description: Ingest run updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestRunResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/persons:
    get:
      tags: [Persons]
      summary: List canonical persons
      operationId: listPersons
      description: |
        Paginated generalized person list used by the authenticated UI. Filters
        are combined with AND semantics; repeated entity/source keys use their
        corresponding mode. CRM deal bounds count distinct active Bitrix CRM
        deal source records and are inclusive. `meta.next_cursor` is the
        authoritative continuation signal. Exact counting is enabled by default
        but callers may disable it for faster reads.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: entity_key
          in: query
          schema:
            type: array
            items:
              type: string
          example: ["fundbox-sg"]
        - name: entity_key_mode
          in: query
          description: Combine repeated entity keys with `or` or `and`.
          schema:
            type: string
            enum: [or, and]
        - name: source_key
          in: query
          schema:
            type: array
            items:
              type: string
          example: ["fundbox"]
        - name: source_key_mode
          in: query
          description: Combine repeated source keys with `or` or `and`.
          schema:
            type: string
            enum: [or, and]
        - name: source_record_type
          in: query
          schema:
            type: string
        - name: is_high_value
          in: query
          schema:
            type: boolean
        - name: is_high_risk
          in: query
          schema:
            type: boolean
        - name: has_phone
          in: query
          schema:
            type: boolean
        - name: has_email
          in: query
          schema:
            type: boolean
        - name: has_any_contact
          in: query
          schema:
            type: boolean
        - name: has_address
          in: query
          schema:
            type: boolean
        - name: has_bankruptcy_case
          in: query
          schema:
            type: boolean
        - name: has_any_match
          in: query
          schema:
            type: boolean
        - name: has_possible_match
          in: query
          schema:
            type: boolean
        - name: has_system_match
          in: query
          schema:
            type: boolean
        - name: crm_deal_count_min
          in: query
          schema:
            type: integer
            minimum: 0
        - name: crm_deal_count_max
          in: query
          schema:
            type: integer
            minimum: 0
        - name: addr_street
          in: query
          schema:
            type: string
        - name: addr_unit
          in: query
          schema:
            type: string
        - name: addr_city
          in: query
          schema:
            type: string
        - name: addr_postal
          in: query
          schema:
            type: string
        - name: addr_country
          in: query
          schema:
            type: string
        - name: updated_after
          in: query
          schema:
            type: string
        - name: updated_before
          in: query
          schema:
            type: string
        - name: has_dob
          in: query
          schema:
            type: boolean
        - name: dob_from
          in: query
          schema:
            type: string
        - name: dob_to
          in: query
          schema:
            type: string
        - name: dob_year
          in: query
          schema:
            type: string
        - name: dob_month
          in: query
          schema:
            type: string
        - name: dob_day
          in: query
          schema:
            type: string
        - name: q
          in: query
          description: |
            Free-text search (min 3 chars) across `preferred_full_name`,
            `preferred_nric`, `preferred_email`, and `preferred_phone`.
          schema:
            type: string
          example: "Tan Wei Ming"
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [preferred_full_name, preferred_phone, preferred_email, preferred_dob, preferred_nric, source_record_count, connection_count, entity_count, possible_match_count, system_match_count, order_count, crm_deal_count, bankruptcy_case_count, phone_confidence, updated_at, profile_completeness_score, relevance]
        - name: sort_order
          in: query
          schema:
            type: string
            enum: [asc, desc]
        - name: cursor
          in: query
          description: Opaque pagination cursor.
          schema:
            type: string
        - name: limit
          in: query
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: include_total
          in: query
          description: >-
            Whether to execute the exact count query. Defaults to true. When
            false, `meta.total_count` is null; use `meta.next_cursor` to continue.
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: Paginated person list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListedPersonListResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/entities/filter-options:
    get:
      tags: [Entities]
      summary: List lightweight entity filter options
      operationId: list_entity_filter_options
      description: >-
        Returns only entity keys and display names for person-list filters; it
        intentionally avoids person and source-record aggregation.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Entity filter options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityFilterOptionsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/entities/metadata:
    get:
      tags: [Entities]
      summary: List lightweight entity metadata
      operationId: list_entity_metadata
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      responses:
        '200':
          description: Entity metadata without aggregate metrics
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EntityMetadataListEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/entities/metrics:
    get:
      tags: [Entities]
      summary: List exact entity metrics
      operationId: list_entity_metrics
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      responses:
        '200':
          description: Exact entity aggregate metrics keyed by entity
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EntityMetricsListEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/persons/search:
    get:
      tags: [Persons]
      summary: Search canonical persons for operational workflows
      operationId: searchPersons
      security:
        - bearerAuth: []
      parameters:
        - name: identifier_type
          in: query
          schema:
            $ref: '#/components/schemas/IdentifierType'
        - name: value
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
            minLength: 3
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/PersonStatus'
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Operational person-search results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonSearchResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/persons/summary:
    get:
      tags: [Persons]
      summary: Get person-listing summary counts
      operationId: getPersonListSummary
      description: >-
        Returns the all-profile, high-risk, high-value, and no-contact counts
        shown above the authenticated person listing. Counts exclude merged
        persons and are calculated in one aggregate graph read.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Person-listing summary counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonListSummaryEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/persons/summary/core:
    get:
      tags: [Persons]
      summary: Get non-CRM person-listing summary counts
      operationId: getPersonListCoreSummary
      description: Returns exact profile, risk, value, and contact counts without CRM deal aggregation.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Non-CRM person-listing summary counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonListCoreSummaryEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/persons/summary/crm:
    get:
      tags: [Persons]
      summary: Get exact CRM person-listing summary counts
      operationId: getPersonListCrmSummary
      description: Returns exact CRM deal counts independently from the non-CRM listing summary.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: CRM person-listing summary counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonListCrmSummaryEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/persons/{person_id}:
    get:
      tags: [Persons]
      summary: Get canonical person detail
      operationId: getPerson
      parameters:
        - $ref: '#/components/parameters/PersonId'
        - $ref: '#/components/parameters/RequestId'
        - name: include
          in: query
          description: Comma-separated expansions
          schema:
            type: string
      responses:
        '200':
          description: Person detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonDetailResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PersonNotFound'
  /v1/persons/{person_id}/source-records:
    get:
      tags: [Persons]
      summary: Get effective-active source records linked to a person
      operationId: getPersonSourceRecords
      parameters:
        - $ref: '#/components/parameters/PersonId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: >-
            Active source records for the person, including temporary legacy
            effective-active records during lifecycle migration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceRecordListResponseEnvelope'
        '404':
          $ref: '#/components/responses/PersonNotFound'
  /v1/persons/{person_id}/crm/metrics:
    get:
      tags: [Persons]
      summary: Get CRM engagement metrics for a person
      operationId: getPersonCrmMetrics
      description: >-
        Returns read-only aggregate counts and date ranges computed from
        effective-active CRM deals, CRM activities, calls, and conversations
        from the bitrix_chat source that are linked to the person's merge
        survivor. The graph reader admits only legacy-null or activity-family
        CRM history records, uses active person-record links, and excludes
        superseded or rejected records.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PersonId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Aggregate CRM engagement metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonCrmMetricsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PersonNotFound'
  /v1/persons/{person_id}/profile-analyses:
    get:
      tags: [Persons]
      summary: Get current Person profile analyses and refresh states
      operationId: getPersonProfileAnalyses
      description: |
        Authenticated human frontend surface only. The canonical path is served
        at runtime as `/api/app/v2/persons/{person_id}/profile-analyses`; it is
        not mounted on the root/public app or the `/oauth2/v1` machine subset.

        The independent sales and contact-tracing slots retain any prior
        successful current content while a newer revision is pending, running,
        or failed. Slot state is `ready` for a result at the Person's current
        input revision that is within its 24-hour validity period, `idle` for
        invalid output with no request, `pending` for a queued on-demand request,
        `running` for an active refresh claim, `retrying` for a legacy failure
        whose stored retry timestamp is still in the future, `failed` for a
        current-revision terminal failure when no refresh is active (including
        an elapsed legacy retry timestamp), and `disabled` when generation is
        paused by rollout configuration.
        Overall state uses
        this precedence: disabled, running, retrying, ready/partial, failed,
        then pending.
      security:
        - humanBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PersonId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Current analyses and independent refresh states
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonProfileAnalysesResponseEnvelope'
              example:
                data:
                  input_revision: 8
                  refresh_state: running
                  sales:
                    current:
                      analysis_id: "2df33d31-62bb-41e7-9966-4110a7e342eb"
                      person_id: "7af4b5f5-34c1-4f22-9e2d-95ea8ff3b8c7"
                      analysis_type: sales
                      status: succeeded
                      content: "Observed repeat purchases.\n\nLimitations: evidence is incomplete."
                      input_revision: 7
                      input_fingerprint: "sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
                      prompt_version: sales-profile-v1
                      provider: proclaude
                      model: analysis-model
                      started_at: "2026-07-21T01:00:00+00:00"
                      completed_at: "2026-07-21T01:02:00+00:00"
                      completed_at_display: "21 Jul 2026, 01:02 AM"
                      generated_age_display: "6 days ago"
                      valid_until: "2026-07-22T01:02:00+00:00"
                      valid_until_display: "22 Jul 2026, 01:02 AM"
                      attempt_number: 2
                    stale: true
                    expired: true
                    valid: false
                    invalid_reason: stale_and_expired
                    refresh_state: running
                    failure_code: null
                    auto_request_allowed: false
                    next_retry_at: null
                    next_retry_at_display: null
                    retry_allowed: false
                    retry_attempts_remaining: 3
                    retry_available_at: null
                    retry_available_at_display: null
                    force_attempts_remaining: 3
                    force_available_at: null
                    force_available_at_display: null
                  contact_tracing:
                    current: null
                    stale: false
                    expired: false
                    valid: false
                    invalid_reason: missing
                    refresh_state: pending
                    failure_code: null
                    auto_request_allowed: false
                    next_retry_at: null
                    next_retry_at_display: null
                    retry_allowed: false
                    retry_attempts_remaining: 3
                    retry_available_at: null
                    retry_available_at_display: null
                    force_attempts_remaining: 3
                    force_available_at: null
                    force_available_at_display: null
                meta:
                  request_id: "req_abc123"
                  next_cursor: null
                  total_count: null
                display_items: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PersonNotFound'
  /v1/persons/{person_id}/profile-analyses/requests:
    post:
      tags: [Persons]
      summary: Generate one on-demand Person profile analysis
      operationId: requestPersonProfileAnalysis
      description: |
        Authenticated human frontend surface only. Requests exactly one analysis
        type for the canonical Person and completes generation in the API
        request. Normal requests are accepted only for
        missing, stale, or expired output. Forced requests can replace valid
        output and are limited to three accepted requests per canonical Person
        and analysis type in a rolling hour.
      security:
        - humanBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PersonId'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileAnalysisRequestBody'
      responses:
        '200':
          description: Analysis completed, already active, or already valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileAnalysisRequestResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PersonNotFound'
        '409':
          description: Profile analysis is disabled.
        '429':
          description: Forced-refresh rolling-hour limit reached.
        '503':
          description: The analysis could not be completed.
  /v1/persons/{person_id}/profile-analyses/retries:
    post:
      tags: [Persons]
      summary: Retry one terminal failed Person profile analysis
      operationId: retryFailedPersonProfileAnalysis
      description: |
        Authenticated human frontend surface only. Runs a fresh request for a
        terminal failure at the canonical Person's current input revision. Each
        authenticated user may run at most three such retries across both
        analysis types for the same canonical Person in a rolling hour.
      security:
        - humanBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PersonId'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileAnalysisRetryBody'
      responses:
        '200':
          description: Retry completed or an equivalent request is already active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileAnalysisRetryResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PersonNotFound'
        '409':
          description: The selected analysis is no longer terminally failed or generation is disabled.
        '429':
          description: Per-user, per-Person rolling-hour retry limit reached.
        '503':
          description: The retry could not be completed.
  /v1/persons/{person_id}/profile-analyses/requests/{request_id}/requeue:
    post:
      tags: [Persons]
      summary: Regenerate one recoverable failed Person profile-analysis request
      operationId: requeueFailedPersonProfileAnalysis
      description: |
        Authenticated human administrator surface only. Regenerates one terminal
        failed request only when it has the current input revision, has no
        active request for the same analysis type, remains within the configured
        attempt bound, and its safe failure code is explicitly recoverable.
        Privacy-boundary failures are never regenerated by this endpoint.
      security:
        - humanBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PersonId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Failed request regenerated directly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileAnalysisRequestRequeueResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Person or profile-analysis request not found.
        '409':
          description: Requeue is not permitted for the terminal request state.
        '503':
          description: The regenerated request could not be completed.
  /v1/persons/{person_id}/profile-analyses/history:
    get:
      tags: [Persons]
      summary: Get immutable Person profile-analysis history
      operationId: getPersonProfileAnalysisHistory
      description: |
        Authenticated human frontend surface only, served at runtime as
        `/api/app/v2/persons/{person_id}/profile-analyses/history` and excluded
        from the root/public app and `/oauth2/v1` machine subset.

        Returns terminal `succeeded`, `failed`, and `obsolete` attempts in
        deterministic newest-first order by `completed_at DESC`, then
        `analysis_id DESC`. Safe immutable fields and safe failure metadata are
        returned; provider response bodies, prompts, input snapshots, raw
        payloads, credentials, and direct identifiers are never returned.
        `meta.total_count` counts all entries matching the optional type filter
        before pagination.
      security:
        - humanBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PersonId'
        - $ref: '#/components/parameters/RequestId'
        - name: analysis_type
          in: query
          required: false
          description: Restrict history to one independent analysis type.
          schema:
            $ref: '#/components/schemas/ProfileAnalysisType'
        - name: cursor
          in: query
          required: false
          description: Opaque offset cursor from `meta.next_cursor`; omit for the first page.
          schema:
            type: string
          example: "MjA="
        - name: limit
          in: query
          required: false
          description: >-
            Page size; defaults to 20, non-positive values use the default, and
            values above 200 are clamped to 200.
          schema:
            type: integer
            default: 20
          example: 20
      responses:
        '200':
          description: Cursor-paginated terminal analysis history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileAnalysisHistoryResponseEnvelope'
              example:
                data:
                  - analysis_id: "0bf90451-c932-4fc4-833a-c705052bca20"
                    person_id: "7af4b5f5-34c1-4f22-9e2d-95ea8ff3b8c7"
                    analysis_type: sales
                    status: failed
                    content: null
                    input_revision: 8
                    input_fingerprint: "sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
                    prompt_version: sales-profile-v1
                    provider: proclaude
                    model: analysis-model
                    started_at: "2026-07-21T02:00:00+00:00"
                    completed_at: "2026-07-21T02:00:05+00:00"
                    completed_at_display: "21 Jul 2026, 02:00 AM"
                    attempt_number: 3
                    failure_code: rate_limited
                    retryable: true
                    next_retry_at: "2026-07-21T02:10:05+00:00"
                meta:
                  request_id: "req_abc123"
                  next_cursor: "MjA="
                  total_count: 37
                display_items: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PersonNotFound'
