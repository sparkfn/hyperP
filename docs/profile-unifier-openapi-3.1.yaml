              schema:
                $ref: '#/components/schemas/FieldTrustListResponseEnvelope'
  /v1/events:
    get:
      tags: [Admin]
      summary: Poll for identity change events
      operationId: listEvents
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: since
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: event_type
          in: query
          schema:
            type: string
            enum:
              - person_created
              - person_merged
              - person_unmerged
              - golden_profile_updated
              - review_case_resolved
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Events since the given timestamp
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicSuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bearer JWT accepted by HyperP APIs. Human users send Google OAuth 2.0 ID
        tokens obtained through the browser/NextAuth flow. Machine callers send
        HyperP-issued OAuth2 client-credentials access tokens from
        `POST /v1/oauth/token`.
    humanBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Google ID token
      description: |
        Google OAuth 2.0 ID token for an authenticated browser/human user.
        HyperP OAuth2 client-credentials access tokens are rejected with 403.
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
    SourceKey:
      name: source_key
      in: path
      required: true
      schema:
        type: string
    PersonId:
      name: person_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReviewCaseId:
      name: review_case_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IngestRunId:
      name: ingest_run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LockId:
      name: lock_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OAuthClientId:
      name: client_id
      in: path
      required: true
      schema:
        type: string
      example: hpc_2VhJd9uLS2wK8f3P
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseEnvelope'
    UnprocessableEntity:
      description: Request body or parameters failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseEnvelope'
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseEnvelope'
    Forbidden:
      description: Caller does not have the required role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseEnvelope'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseEnvelope'
    Conflict:
      description: Request conflicts with current state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseEnvelope'
    ServiceUnavailable:
      description: Ingestion could not be queued
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseEnvelope'
    PersonNotFound:
      description: Person was not found
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponseEnvelope'
    ReviewCaseNotFound:
      description: Review case was not found
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponseEnvelope'
    MergeBlocked:
      description: Merge blocked by lock or hard policy
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseEnvelope'
  schemas:
    IdentityLinkRevision:
      type: object
      description: >-
        Privacy-safe immutable identity-link state. Raw source payloads,
        identifiers, candidate IDs, scores, reasons, lock topology, and internal
        stream/cause keys are deliberately excluded.
      properties:
        event_id: {type: string}
        global_revision: {type: integer, minimum: 1}
        source_system: {type: string}
        source_instance_id: {type: string}
        source_entity_type: {type: string, enum: [deal, contact, lead, company]}
        source_entity_id: {type: string}
        identity_policy_version: {type: string}
        link_status: {type: string, enum: [resolved, unresolved, pending_review, blocked, rejected, retired]}
        hyperp_person_id: {type: [string, 'null']}
        resolution_kind: {type: string, enum: [baseline, automatic_activation, reviewed_activation, review_rejection, manual_no_match, source_supersession, person_merge, person_unmerge, person_retirement, source_retirement]}
        resolution_revision: {type: integer, minimum: 1}
        effective_at: {type: string, format: date-time}
        match_decision_id: {type: [string, 'null']}
        review_case_id: {type: [string, 'null']}
        supersedes_event_id: {type: [string, 'null']}
      required: [event_id, global_revision, source_system, source_instance_id, source_entity_type, source_entity_id, identity_policy_version, link_status, hyperp_person_id, resolution_kind, resolution_revision, effective_at, match_decision_id, review_case_id, supersedes_event_id]
      additionalProperties: false
    IdentityLinkEventsResponse:
      type: object
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/IdentityLinkRevision'}}
        meta: {$ref: '#/components/schemas/Meta'}
        through_revision: {type: integer, minimum: 0}
      required: [data, meta, through_revision]
      additionalProperties: false
    IdentityLinkSnapshotResponse:
      type: object
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/IdentityLinkRevision'}}
        meta: {$ref: '#/components/schemas/Meta'}
        snapshot_revision: {type: integer, minimum: 0}
      required: [data, meta, snapshot_revision]
      additionalProperties: false
    Meta:
      type: object
      properties:
        request_id:
          type: string
        next_cursor:
          type:
            - string
            - 'null'
        total_count:
          type:
            - integer
            - 'null'
          description: >-
            Exact matching total when requested; null when exact counting is
            disabled or the endpoint does not provide a total.
      required: [request_id]
      additionalProperties: false
    ErrorObject:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
      required: [code, message, details]
      additionalProperties: false
    ErrorResponseEnvelope:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorObject'
        meta:
          $ref: '#/components/schemas/Meta'
      required: [error, meta]
      additionalProperties: false
    IdentifierType:
      type: string
      enum:
        - government_id_hash
        - phone
        - email
        - external_customer_id
        - membership_id
        - crm_contact_id
        - loyalty_id
        - custom
    PersonStatus:
      type: string
      enum: [active, merged, suppressed, retired]
    ReviewQueueState:
      type: string
      enum: [open, assigned, deferred, resolved, cancelled]
    ReviewResolution:
      type: string
      enum: [merge, reject, manual_no_match, cancelled_superseded]
    ReviewActionType:
      type: string
      enum: [merge, reject, defer, escalate, manual_no_match]
    PersonSummary:
      type: object
      properties:
        person_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/PersonStatus'
        is_high_value:
          type: boolean
        is_high_risk:
          type: boolean
        golden_profile:
          $ref: '#/components/schemas/GoldenProfile'
        source_record_count:
          type: integer
        identifier_counts:
          type: object
          additionalProperties:
            type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - person_id
        - status
        - is_high_value
        - is_high_risk
        - golden_profile
        - source_record_count
        - identifier_counts
        - created_at
        - updated_at
      additionalProperties: false
    LoyaltySummary:
      type: object
      properties:
        source_system:
          type: string
        points:
          type: integer
          nullable: true
        disable_loyalty:
          type: boolean
          nullable: true
        current_spend_for_points:
          type: number
          nullable: true
        current_sales_for_discount:
          type: number
          nullable: true
        observed_at:
          type: string
          nullable: true
      required: [source_system]
      additionalProperties: false
    VehicleSummary:
      type: object
      properties:
        vehicle_id:
          type: string
        product:
          type: string
          nullable: true
        product_sku:
          type: string
          nullable: true
        manufacturer:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        lta_tag:
          type: string
          nullable: true
        serial_number:
          type: string
          nullable: true
        relationship:
          type: string
          enum: [OWNS, BOUGHT]
        is_active:
          type: boolean
          nullable: true
        conflict_flag:
          type: boolean
          nullable: true
        observed_at:
          type: string
          nullable: true
      required: [vehicle_id, relationship]
      additionalProperties: false
    PersonListSummary:
      type: object
      properties:
        all_profiles_count:
          type: integer
          minimum: 0
        high_risk_count:
          type: integer
          minimum: 0
        high_value_count:
          type: integer
          minimum: 0
        no_contact_count:
          type: integer
          minimum: 0
        deals_this_month_count:
          type: integer
          minimum: 0
        all_deals_count:
          type: integer
          minimum: 0
      required: [all_profiles_count, high_risk_count, high_value_count, no_contact_count, deals_this_month_count, all_deals_count]
      additionalProperties: false
    PersonListSummaryEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PersonListSummary'
        meta:
          $ref: '#/components/schemas/Meta'
      required: [data, meta]
      additionalProperties: false
    PersonListCoreSummary:
      type: object
      properties:
        all_profiles_count:
          type: integer
          minimum: 0
        high_risk_count:
          type: integer
          minimum: 0
        high_value_count:
          type: integer
          minimum: 0
        no_contact_count:
          type: integer
          minimum: 0
      required: [all_profiles_count, high_risk_count, high_value_count, no_contact_count]
      additionalProperties: false
    PersonListCoreSummaryEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PersonListCoreSummary'
        meta:
          $ref: '#/components/schemas/Meta'
      required: [data, meta]
      additionalProperties: false
    PersonListCrmSummary:
      type: object
      properties:
        deals_this_month_count:
          type: integer
          minimum: 0
        all_deals_count:
          type: integer
          minimum: 0
      required: [deals_this_month_count, all_deals_count]
      additionalProperties: false
    PersonListCrmSummaryEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PersonListCrmSummary'
        meta:
          $ref: '#/components/schemas/Meta'
      required: [data, meta]
      additionalProperties: false
    CrmActivityKindCount:
      type: object
      properties:
        history_kind:
          type: string
        count:
          type: integer
          minimum: 0
        last_event_at:
          type:
            - string
            - 'null'
          format: date-time
        last_event_at_display:
          type:
            - string
            - 'null'
      required: [history_kind, count, last_event_at, last_event_at_display]
      additionalProperties: false
    CrmDealStageCount:
      type: object
      properties:
        stage_id:
          type:
            - string
            - 'null'
        count:
          type: integer
          minimum: 0
      required: [stage_id, count]
      additionalProperties: false
    CrmEntityBreakdown:
      type: object
      properties:
        entity_key:
          type: string
        entity_display_name:
          type:
            - string
            - 'null'
        deal_count:
          type: integer
          minimum: 0
        activity_count:
          type: integer
          minimum: 0
        conversation_count:
          type: integer
          minimum: 0
      required:
        - entity_key
        - entity_display_name
        - deal_count
        - activity_count
        - conversation_count
      additionalProperties: false
    PersonCrmMetrics:
      type: object
      properties:
        deal_count:
          type: integer
          minimum: 0
        deal_stage_breakdown:
          type: array
          items:
            $ref: '#/components/schemas/CrmDealStageCount'
        first_deal_at:
          type:
            - string
            - 'null'
          format: date-time
        first_deal_at_display:
          type:
            - string
            - 'null'
        last_deal_at:
