    ProfileAnalysisType:
      type: string
      enum: [sales, contact_tracing]
    ProfileAnalysisStatus:
      type: string
      enum: [succeeded, failed, obsolete]
    ProfileAnalysisSlotRefreshState:
      type: string
      enum: [disabled, idle, pending, running, retrying, ready, failed]
      description: |
        `disabled` means generation is paused by rollout configuration;
        `ready` means current content matches the Person input revision;
        `running` means a refresh claim is active; `retrying` is a compatibility
        state for a historical failure whose stored retry timestamp is still in
        the future (direct executions do not schedule new retries); `failed`
        means a terminal failure exists for the current revision and no refresh
        is active, including after a legacy retry timestamp elapses; and
        `idle` means output is missing, stale, or expired with no active request;
        `pending` means an on-demand request is queued.
    ProfileAnalysisRefreshState:
      type: string
      enum: [disabled, pending, running, retrying, ready, partial, failed]
      description: |
        `disabled` means generation is paused. Otherwise this is derived from
        both slots. `running` takes precedence when either slot is running,
        followed by `retrying` for a future legacy retry timestamp; `ready` means both
        are ready; `partial` means exactly one is
        ready and neither is running; `failed` means neither is ready or
        running and at least one failed; otherwise the state is `pending`.
    SafeProfileAnalysisFailureCode:
      description: >-
        Sanitized lower-case failure code. Unsafe or unavailable stored values
        are returned as null; provider response bodies are never returned.
      type:
        - string
        - 'null'
      pattern: '^[a-z][a-z0-9]*(?:_[a-z0-9]+)*$'
      maxLength: 64
    ProfileAnalysisCurrent:
      type: object
      description: Currently published successful analysis with immutable provenance.
      properties:
        analysis_id:
          type: string
        person_id:
          type: string
        analysis_type:
          $ref: '#/components/schemas/ProfileAnalysisType'
        status:
          type: string
          const: succeeded
        content:
          type: string
        input_revision:
          type: integer
          minimum: 0
        input_fingerprint:
          type: string
        prompt_version:
          type: string
        provider:
          type: string
        model:
          type: string
        started_at:
          type: string
          format: date-time
          description: Timezone-aware ISO 8601 timestamp.
        completed_at:
          type: string
          format: date-time
          description: Timezone-aware ISO 8601 timestamp.
        completed_at_display:
          type: string
          description: Human-facing completion time formatted by the API.
        generated_age_display:
          type: string
          description: Human-facing relative age formatted by the API.
        valid_until:
          type: string
          format: date-time
        valid_until_display:
          type: string
          description: Human-facing validity deadline formatted by the API.
        attempt_number:
          type: integer
          minimum: 1
      required:
        - analysis_id
        - person_id
        - analysis_type
        - status
        - content
        - input_revision
        - input_fingerprint
        - prompt_version
        - provider
        - model
        - started_at
        - completed_at
        - completed_at_display
        - generated_age_display
        - valid_until
        - valid_until_display
        - attempt_number
      additionalProperties: false
    ProfileAnalysisSlot:
      type: object
      description: |
        Independent current output and refresh state for one analysis type.
        Previously published current content is retained while a newer revision
        is pending, running, or failed.
      properties:
        current:
          oneOf:
            - $ref: '#/components/schemas/ProfileAnalysisCurrent'
            - type: 'null'
        stale:
          type: boolean
          description: Current content exists but has an older input revision.
        expired:
          type: boolean
        valid:
          type: boolean
        invalid_reason:
          type: [string, 'null']
          enum: [missing, stale, expired, stale_and_expired, null]
        refresh_state:
          $ref: '#/components/schemas/ProfileAnalysisSlotRefreshState'
        failure_code:
          $ref: '#/components/schemas/SafeProfileAnalysisFailureCode'
        auto_request_allowed:
          type: boolean
        next_retry_at:
          type: [string, 'null']
          format: date-time
        next_retry_at_display:
          type: [string, 'null']
        retry_allowed:
          type: boolean
        retry_attempts_remaining:
          type: integer
          minimum: 0
          maximum: 3
        retry_available_at:
          type: [string, 'null']
          format: date-time
        retry_available_at_display:
          type: [string, 'null']
        force_attempts_remaining:
          type: integer
          minimum: 0
          maximum: 3
        force_available_at:
          type: [string, 'null']
          format: date-time
        force_available_at_display:
          type: [string, 'null']
      required: [current, stale, expired, valid, invalid_reason, refresh_state, failure_code, auto_request_allowed, next_retry_at, next_retry_at_display, retry_allowed, retry_attempts_remaining, retry_available_at, retry_available_at_display, force_attempts_remaining, force_available_at, force_available_at_display]
