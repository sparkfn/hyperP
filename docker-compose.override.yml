services:
  frontend2:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --legacy-peer-deps && npm run dev"
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://api:3000}
      NODE_ENV: development
      PORT: 3002
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      NEXTAUTH_URL: ${FRONTEND2_NEXTAUTH_URL:-http://localhost:3002}
      AUTH_TRUST_HOST: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./services/frontend2:/app
      - frontend2_node_modules:/app/node_modules
      - frontend2_next:/app/.next

volumes:
  frontend2_node_modules:
  frontend2_next:
