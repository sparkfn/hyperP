  PHPPOS_API_TIMEOUT_SECONDS: ${PHPPOS_API_TIMEOUT_SECONDS:-30.0}
  PHPPOS_API_MAX_ATTEMPTS: ${PHPPOS_API_MAX_ATTEMPTS:-3}
  SPEEDZONE_PHPPOS_API_TENANT_ID: ${SPEEDZONE_PHPPOS_API_TENANT_ID:-}
  EKO_PHPPOS_API_TENANT_ID: ${EKO_PHPPOS_API_TENANT_ID:-}
  SGBANKRUPTCY_API_BASE_URL: ${SGBANKRUPTCY_API_BASE_URL:-}
  SGBANKRUPTCY_API_KEY: ${SGBANKRUPTCY_API_KEY:-}
  SGBANKRUPTCY_API_PAGE_SIZE: ${SGBANKRUPTCY_API_PAGE_SIZE:-500}
  SGBANKRUPTCY_API_TIMEOUT_SECONDS: ${SGBANKRUPTCY_API_TIMEOUT_SECONDS:-30.0}
