  GPT_API_BASE_URL: ${GPT_API_BASE_URL:-https://gpt.ada.asia/api/v1}
  GPT_API_KEY: ${GPT_API_KEY:-}
  GPT_DEFAULT_MODEL: ${GPT_DEFAULT_MODEL:-gpt-4o}
  BITRIX_CHAT_SSH_HOST: ${BITRIX_CHAT_SSH_HOST:-}
  BITRIX_CHAT_SSH_PORT: ${BITRIX_CHAT_SSH_PORT:-2222}
  BITRIX_CHAT_SSH_USER: ${BITRIX_CHAT_SSH_USER:-}
  BITRIX_CHAT_SSH_PASSWORD: ${BITRIX_CHAT_SSH_PASSWORD:-}
  BITRIX_CHAT_DB_HOST: ${BITRIX_CHAT_DB_HOST:-mariadb-bitrix-chat}
  BITRIX_CHAT_DB_PORT: ${BITRIX_CHAT_DB_PORT:-3306}
  BITRIX_CHAT_DB_USER: ${BITRIX_CHAT_DB_USER:-root}
  BITRIX_CHAT_DB_PASSWORD: ${BITRIX_CHAT_DB_PASSWORD:-}
  BITRIX_CHAT_DB_NAME: ${BITRIX_CHAT_DB_NAME:-bitrix_chat}
  BITRIX_CHAT_CHUNK_SIZE: ${BITRIX_CHAT_CHUNK_SIZE:-500}
  BITRIX_OPENLINES_API_BASE_URL: ${BITRIX_OPENLINES_API_BASE_URL:-}
  BITRIX_OPENLINES_API_TIMEOUT_SECONDS: ${BITRIX_OPENLINES_API_TIMEOUT_SECONDS:-30.0}
  BITRIX_OPENLINES_API_MAX_ATTEMPTS: ${BITRIX_OPENLINES_API_MAX_ATTEMPTS:-3}
  BITRIX_OPENLINES_API_REQUEST_DELAY_SECONDS: ${BITRIX_OPENLINES_API_REQUEST_DELAY_SECONDS:-0.5}
  WHATSAPP_CHAT_SSH_HOST: ${WHATSAPP_CHAT_SSH_HOST:-}
  WHATSAPP_CHAT_SSH_PORT: ${WHATSAPP_CHAT_SSH_PORT:-2222}
  WHATSAPP_CHAT_SSH_USER: ${WHATSAPP_CHAT_SSH_USER:-}
  WHATSAPP_CHAT_SSH_PASSWORD: ${WHATSAPP_CHAT_SSH_PASSWORD:-}
  WHATSAPP_CHAT_DB_HOST: ${WHATSAPP_CHAT_DB_HOST:-postgres-whatsapp}
  WHATSAPP_CHAT_DB_PORT: ${WHATSAPP_CHAT_DB_PORT:-5432}
  WHATSAPP_CHAT_DB_USER: ${WHATSAPP_CHAT_DB_USER:-postgres}
  WHATSAPP_CHAT_DB_PASSWORD: ${WHATSAPP_CHAT_DB_PASSWORD:-}
  WHATSAPP_CHAT_DB_NAME: ${WHATSAPP_CHAT_DB_NAME:-whatsapp_api}
  WHATSAPP_CHAT_CHUNK_SIZE: ${WHATSAPP_CHAT_CHUNK_SIZE:-500}
  INGESTION_CONFIG_FILE: ${INGESTION_CONFIG_FILE:-/app/config/ingestion-config.example.json}
  SALES_PREDICTION_ARTIFACT_PRIMARY_ROOT: /app/restricted/sales-prediction
  SALES_PREDICTION_ARTIFACT_BACKUP_ROOT: /app/restricted/sales-prediction-backup
  SALES_PREDICTION_ARTIFACT_SIGNING_KEY_ID: ${SALES_PREDICTION_ARTIFACT_SIGNING_KEY_ID:-}
  SALES_PREDICTION_ARTIFACT_SIGNING_KEY_SECRET: ${SALES_PREDICTION_ARTIFACT_SIGNING_KEY_SECRET:-}
  SALES_PREDICTION_REPOSITORY_SHA: ${SALES_PREDICTION_REPOSITORY_SHA:-}
  SALES_PREDICTION_IMAGE_DIGEST: ${SALES_PREDICTION_IMAGE_DIGEST:-}
  TZ: ${TZ:-UTC}

services:
  neo4j:
    image: neo4j:5.26-community
    cpus: 2.0
    mem_limit: 3G
    stop_grace_period: 30s
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme}
      NEO4J_PLUGINS: '[]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
      NEO4J_server_memory_off__heap_transaction__max__size: 512m
      NEO4J_server_jvm_additional: --add-modules jdk.incubator.vector
    volumes:
      - ./data/neo4j/data:/data
      - ./data/neo4j/logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-changeme}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    cpus: 0.5
    mem_limit: 512M
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    cpus: 1.0
    mem_limit: 1G
    # Not exposed externally — all ingress goes through the nginx web service.
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
      PORT: 3000
      LOG_LEVEL: info
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_HOSTED_DOMAIN: ${AUTH_GOOGLE_HOSTED_DOMAIN:-}
      BOOTSTRAP_ADMIN_EMAILS: ${BOOTSTRAP_ADMIN_EMAILS:-}
      PUBLIC_PAGE_EXPIRY_MINUTES: ${PUBLIC_PAGE_EXPIRY_MINUTES:-30}
      OAUTH_ISSUER: ${OAUTH_ISSUER:-http://localhost/api}
      OAUTH_AUDIENCE: ${OAUTH_AUDIENCE:-hyperp-api}
      OAUTH_ACTIVE_KEY_ID: ${OAUTH_ACTIVE_KEY_ID:-local-dev}
      OAUTH_PRIVATE_KEY_PEM: ${OAUTH_PRIVATE_KEY_PEM:-}
      OAUTH_PUBLIC_KEY_PEM: ${OAUTH_PUBLIC_KEY_PEM:-}
      OAUTH_SECRET_HASH_KEY: ${OAUTH_SECRET_HASH_KEY:-}
      PROCLAUDE_API_BASE_URL: ${PROCLAUDE_API_BASE_URL:-}
      PROCLAUDE_API_KEY: ${PROCLAUDE_API_KEY:-}
      PROCLAUDE_DEFAULT_MODEL: ${PROCLAUDE_DEFAULT_MODEL:-}
      PROFILE_ANALYSIS_ENABLED: ${PROFILE_ANALYSIS_ENABLED:-false}
      PROFILE_ANALYSIS_CLAIM_LEASE_SECONDS: ${PROFILE_ANALYSIS_CLAIM_LEASE_SECONDS:-900}
      PROFILE_ANALYSIS_RETRY_LIMIT: ${PROFILE_ANALYSIS_RETRY_LIMIT:-3}
      ROOT_PATH: /api
      DUMPS_ROOT: /app/dumps
      CELERY_BROKER_URL: redis://redis:6379/0
      TZ: ${TZ:-UTC}
    volumes:
      - ../../.dumps:/app/dumps:ro
    depends_on:
      neo4j:
        condition: service_healthy

  frontend2:
    build:
      context: ../..
      dockerfile: services/frontend2/Dockerfile
      args:
        NEXT_PUBLIC_TZ: ${TZ:-UTC}
    cpus: 2.0
    mem_limit: 2G
    restart: unless-stopped
    # Not exposed externally — all ingress goes through the nginx web service.
    environment:
      # Base includes the /api prefix; buildApiUrl prepends /app/v2 so
      # server-side calls reach the FastAPI /api/app/v2 mount.
      API_BASE_URL: ${FRONTEND2_API_BASE_URL:-http://api:3000/api}
      NODE_ENV: production
      PORT: 3001
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost}
      AUTH_TRUST_HOST: "true"
      AUTH_SESSION_MAX_AGE_SECONDS: ${AUTH_SESSION_MAX_AGE_SECONDS:-18000}
    depends_on:
      - api

  web:
    image: nginx:1.27-alpine
    cpus: 0.25
    mem_limit: 128M
    volumes:
      - ../../services/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend2

    networks:
      - default
      - traefik

  ingestion-worker:
    build:
      context: ../..
      dockerfile: services/ingestion/Dockerfile
      target: base
    cpus: 2.0
    mem_limit: 2G
    stop_grace_period: 5m
    environment: *ingestion-env
    env_file:
      - ./.evidence/issue147-smoke-20260815/stage-history-runtime.env
    volumes:
      - ./data/restricted/sales-prediction:/app/restricted/sales-prediction
      - ./data/restricted/sales-prediction-backup:/app/restricted/sales-prediction-backup
      - ../../.dumps:/app/dumps:ro
      - ../../config:/app/config:ro
      - ./.evidence/issue147-artifacts-primary-20260815:/artifacts-primary
      - ./.evidence/issue147-artifacts-backup-20260815:/artifacts-backup
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - celery
      - -A
      - src.celery_app
      - worker
      - --loglevel=info
      - --queues=ingestion

  lifecycle-worker:
    build:
      context: ../..
      dockerfile: services/ingestion/Dockerfile
    cpus: 1.0
    mem_limit: 1G
    stop_grace_period: 5m
    environment: *ingestion-env
    volumes:
      - ./data/restricted/sales-prediction:/app/restricted/sales-prediction
      - ./data/restricted/sales-prediction-backup:/app/restricted/sales-prediction-backup
      - ../../config:/app/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - celery
      - -A
      - src.celery_app
      - worker
      - --loglevel=info
      - --queues=lifecycle,miscellaneous

  beat:
    build:
      context: ../..
      dockerfile: services/ingestion/Dockerfile
    cpus: 0.25
    mem_limit: 256M
    environment: *ingestion-env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data/celerybeat:/var/celerybeat
      - ../../config:/app/config:ro
    command:
      - celery
      - -A
      - src.celery_app
      - beat
      - --loglevel=info
      - --schedule=/var/celerybeat/schedule

networks:
  traefik:
    external: true
    name: traefik
