# MAIN post-merge validation for sparkfn/hyperP: active workloads only.
# Historical Intelligence, repair, exact-boundary, and training validation is opt-in via
# scripts/ci_historical_validation.py and is never scheduled by Woodpecker.
when:
  event:
    - push
  branch:
    - main

services:
  - name: neo4j-projection
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/ci-projection
      NEO4J_PLUGINS: "[]"
      NEO4J_server_http_enabled: "false"
      NEO4J_server_memory_heap_initial__size: 128m
      NEO4J_server_memory_heap_max__size: 384m
      NEO4J_server_memory_pagecache_size: 128m
  - name: neo4j-census-migration-api
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/ci-census-migration-api
      NEO4J_PLUGINS: "[]"
      NEO4J_server_http_enabled: "false"
      NEO4J_server_memory_heap_initial__size: 128m
      NEO4J_server_memory_heap_max__size: 384m
      NEO4J_server_memory_pagecache_size: 128m
  - name: neo4j-tenant-mapping
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/ci-tenant-mapping
      NEO4J_PLUGINS: "[]"
      NEO4J_server_http_enabled: "false"
      NEO4J_server_memory_heap_initial__size: 128m
      NEO4J_server_memory_heap_max__size: 384m
      NEO4J_server_memory_pagecache_size: 128m

steps:
  - name: python-checks
    image: ghcr.io/astral-sh/uv:python3.12-bookworm
    depends_on: []
    environment:
      HYPERP_CI_PROFILE: active
      UV_PROJECT_ENVIRONMENT: .venv-python-checks
      PYTEST_ADDOPTS: "-o cache_dir=.pytest_cache-python-checks"
      PYTHONDONTWRITEBYTECODE: "1"
    commands:
      - uv sync --frozen --group dev --package profile-unifier-api --package profile-unifier-ingestion
      - uv run --package profile-unifier-api ruff check services/api/src
      - uv run --package profile-unifier-api ruff format --check services/api/src
      - uv run --package profile-unifier-ingestion ruff check services/ingestion/src $(python scripts/ci_selection_manifest.py tool-excludes --tool ruff)
      - uv run --package profile-unifier-ingestion ruff format --check services/ingestion/src $(python scripts/ci_selection_manifest.py tool-excludes --tool ruff)
      - uv run --package profile-unifier-api mypy --strict services/api/src
      - uv run --package profile-unifier-ingestion mypy --strict services/ingestion/src $(python scripts/ci_selection_manifest.py tool-excludes --tool mypy)
      - mkdir -p .ci-manifests
      - uv run --package profile-unifier-api pytest services/api/tests --collect-only -q > .ci-manifests/api-default-nodes.txt
      - python scripts/ci_selection_manifest.py verify-nodes --service api --path .ci-manifests/api-default-nodes.txt
      - uv run --package profile-unifier-ingestion pytest services/ingestion/tests --collect-only -q > .ci-manifests/ingestion-default-nodes.txt
      - python scripts/ci_selection_manifest.py verify-nodes --service ingestion --path .ci-manifests/ingestion-default-nodes.txt
      - uv run --package profile-unifier-api pytest services/api/tests
      - uv run --package profile-unifier-ingestion pytest services/ingestion/tests --durations=25 --durations-min=1.0
      - uv sync --frozen --no-dev --package profile-unifier-api
      - uv sync --frozen --no-dev --package profile-unifier-ingestion

  - name: neo4j-projection-checks
    image: ghcr.io/astral-sh/uv:python3.12-bookworm
    depends_on: []
    environment:
      HYPERP_CI_PROFILE: active
      UV_PROJECT_ENVIRONMENT: .venv-neo4j-projection-checks
      PYTEST_ADDOPTS: "-o cache_dir=.pytest_cache-neo4j-projection-checks"
      PYTHONDONTWRITEBYTECODE: "1"
      HYPERP_NEO4J_STANDALONE_CRM_LANE_A_TEST_URI: bolt://neo4j-projection:7687
      HYPERP_NEO4J_STANDALONE_CRM_LANE_A_TEST_USER: neo4j
      HYPERP_NEO4J_STANDALONE_CRM_LANE_A_TEST_PASSWORD: ci-projection
      HYPERP_NEO4J_STANDALONE_CRM_LANE_A_TEST_SERVICE_HOST: neo4j-projection
      HYPERP_NEO4J_ACTIVE_PUBLICATION_TEST_URI: bolt://neo4j-projection:7687
      HYPERP_NEO4J_ACTIVE_PUBLICATION_TEST_USER: neo4j
      HYPERP_NEO4J_ACTIVE_PUBLICATION_TEST_PASSWORD: ci-projection
      HYPERP_NEO4J_ACTIVE_PUBLICATION_TEST_SERVICE_HOST: neo4j-projection
    commands:
      - uv sync --frozen --group dev --package profile-unifier-ingestion
      - uv run --package profile-unifier-ingestion python scripts/wait_for_neo4j.py --uri-env HYPERP_NEO4J_STANDALONE_CRM_LANE_A_TEST_URI --user-env HYPERP_NEO4J_STANDALONE_CRM_LANE_A_TEST_USER --password-env HYPERP_NEO4J_STANDALONE_CRM_LANE_A_TEST_PASSWORD --timeout-seconds 90
      - uv run --package profile-unifier-ingestion pytest services/ingestion/tests/test_crm_tenant_projection_repository_neo4j.py services/ingestion/tests/test_crm_tenant_activation_neo4j.py services/ingestion/tests/test_active_publication_fencing_neo4j.py -q
      - python scripts/ci_selection_manifest.py query-manifest --workflow .woodpecker/main.yaml

  - name: neo4j-census-migration-api-checks
    image: ghcr.io/astral-sh/uv:python3.12-bookworm
    depends_on: []
    environment:
      HYPERP_CI_PROFILE: active
      UV_PROJECT_ENVIRONMENT: .venv-neo4j-census-migration-api-checks
      PYTEST_ADDOPTS: "-o cache_dir=.pytest_cache-neo4j-census-migration-api-checks"
      PYTHONDONTWRITEBYTECODE: "1"
      HYPERP_NEO4J_PERSON_IDENTIFIERS_TEST_URI: bolt://neo4j-census-migration-api:7687
      HYPERP_NEO4J_PERSON_IDENTIFIERS_TEST_USER: neo4j
      HYPERP_NEO4J_PERSON_IDENTIFIERS_TEST_PASSWORD: ci-census-migration-api
      HYPERP_NEO4J_PERSON_IDENTIFIERS_TEST_SERVICE_HOST: neo4j-census-migration-api
      HYPERP_NEO4J_CRM_METRICS_TEST_URI: bolt://neo4j-census-migration-api:7687
      HYPERP_NEO4J_CRM_METRICS_TEST_USER: neo4j
      HYPERP_NEO4J_CRM_METRICS_TEST_PASSWORD: ci-census-migration-api
      HYPERP_NEO4J_CRM_METRICS_TEST_SERVICE_HOST: neo4j-census-migration-api
      HYPERP_NEO4J_PERSON_LIST_TEST_URI: bolt://neo4j-census-migration-api:7687
      HYPERP_NEO4J_PERSON_LIST_TEST_USER: neo4j
      HYPERP_NEO4J_PERSON_LIST_TEST_PASSWORD: ci-census-migration-api
      HYPERP_NEO4J_PERSON_LIST_TEST_SERVICE_HOST: neo4j-census-migration-api
      HYPERP_NEO4J_PERSON_LIST_TEST_ALLOW_SCHEMA_MUTATION: "1"
      HYPERP_NEO4J_PERSON_COMPLETENESS_TEST_URI: bolt://neo4j-census-migration-api:7687
      HYPERP_NEO4J_PERSON_COMPLETENESS_TEST_USER: neo4j
      HYPERP_NEO4J_PERSON_COMPLETENESS_TEST_PASSWORD: ci-census-migration-api
      HYPERP_NEO4J_PERSON_COMPLETENESS_TEST_SERVICE_HOST: neo4j-census-migration-api
      HYPERP_NEO4J_LOYALTY_POINTS_TEST_URI: bolt://neo4j-census-migration-api:7687
      HYPERP_NEO4J_LOYALTY_POINTS_TEST_USER: neo4j
      HYPERP_NEO4J_LOYALTY_POINTS_TEST_PASSWORD: ci-census-migration-api
      HYPERP_NEO4J_LOYALTY_POINTS_TEST_SERVICE_HOST: neo4j-census-migration-api
      HYPERP_NEO4J_CRM_DEAL_COUNT_TEST_URI: bolt://neo4j-census-migration-api:7687
      HYPERP_NEO4J_CRM_DEAL_COUNT_TEST_USER: neo4j
      HYPERP_NEO4J_CRM_DEAL_COUNT_TEST_PASSWORD: ci-census-migration-api
      HYPERP_NEO4J_CRM_DEAL_COUNT_TEST_SERVICE_HOST: neo4j-census-migration-api
      HYPERP_NEO4J_CONTROL_MIGRATION_TEST_URI: bolt://neo4j-census-migration-api:7687
      HYPERP_NEO4J_CONTROL_MIGRATION_TEST_USER: neo4j
      HYPERP_NEO4J_CONTROL_MIGRATION_TEST_PASSWORD: ci-census-migration-api
      HYPERP_NEO4J_CONTROL_MIGRATION_TEST_SERVICE_HOST: neo4j-census-migration-api
      HYPERP_NEO4J_STANDALONE_CRM_CENSUS_TEST_URI: bolt://neo4j-census-migration-api:7687
      HYPERP_NEO4J_STANDALONE_CRM_CENSUS_TEST_USER: neo4j
      HYPERP_NEO4J_STANDALONE_CRM_CENSUS_TEST_PASSWORD: ci-census-migration-api
      HYPERP_NEO4J_STANDALONE_CRM_CENSUS_TEST_SERVICE_HOST: neo4j-census-migration-api
      HYPERP_NEO4J_STANDALONE_CRM_LANE_A_TEST_URI: bolt://neo4j-census-migration-api:7687
      HYPERP_NEO4J_STANDALONE_CRM_LANE_A_TEST_USER: neo4j
      HYPERP_NEO4J_STANDALONE_CRM_LANE_A_TEST_PASSWORD: ci-census-migration-api
      HYPERP_NEO4J_STANDALONE_CRM_LANE_A_TEST_SERVICE_HOST: neo4j-census-migration-api
    commands:
      - uv sync --frozen --group dev --package profile-unifier-api --package profile-unifier-ingestion
      - uv run --package profile-unifier-ingestion python scripts/wait_for_neo4j.py --uri-env HYPERP_NEO4J_PERSON_COMPLETENESS_TEST_URI --user-env HYPERP_NEO4J_PERSON_COMPLETENESS_TEST_USER --password-env HYPERP_NEO4J_PERSON_COMPLETENESS_TEST_PASSWORD --timeout-seconds 90
      - uv run --package profile-unifier-ingestion pytest services/ingestion/tests/test_identifier_scope_schema_neo4j.py -q
      - uv run --package profile-unifier-api pytest services/api/tests/test_person_identifiers_neo4j.py services/api/tests/test_person_crm_metrics_neo4j.py services/api/tests/test_persons_list_neo4j_234.py services/api/tests/test_persons_list_possible_match_neo4j.py services/api/tests/test_persons_list_plan_neo4j.py services/api/tests/test_identity_link_revisions_neo4j.py services/api/tests/test_person_graph_neo4j.py -q
      - uv run --package profile-unifier-ingestion pytest services/ingestion/tests/test_person_completeness_migration_neo4j.py services/ingestion/tests/test_loyalty_points_migration_neo4j.py services/ingestion/tests/test_crm_deal_count_migration_neo4j.py services/ingestion/tests/test_ingestion_control_instance_migration_neo4j.py services/ingestion/tests/test_identifier_scope_migrations_neo4j.py services/ingestion/tests/test_identity_link_revision_baseline_neo4j.py services/ingestion/tests/test_standalone_crm_census_neo4j.py services/ingestion/tests/test_standalone_crm_lane_a_schema_neo4j.py services/ingestion/tests/test_standalone_crm_source_child_integration_neo4j.py services/ingestion/tests/test_crm_company_membership_neo4j.py -q
      - python scripts/ci_selection_manifest.py query-manifest --workflow .woodpecker/main.yaml

  - name: neo4j-tenant-mapping-checks
    image: ghcr.io/astral-sh/uv:python3.12-bookworm
    depends_on: []
    environment:
      HYPERP_CI_PROFILE: active
      UV_PROJECT_ENVIRONMENT: .venv-neo4j-tenant-mapping-checks
      PYTEST_ADDOPTS: "-o cache_dir=.pytest_cache-neo4j-tenant-mapping-checks"
      PYTHONDONTWRITEBYTECODE: "1"
      HYPERP_NEO4J_STANDALONE_CRM_LANE_A_TEST_URI: bolt://neo4j-tenant-mapping:7687
      HYPERP_NEO4J_STANDALONE_CRM_LANE_A_TEST_USER: neo4j
      HYPERP_NEO4J_STANDALONE_CRM_LANE_A_TEST_PASSWORD: ci-tenant-mapping
      HYPERP_NEO4J_STANDALONE_CRM_LANE_A_TEST_SERVICE_HOST: neo4j-tenant-mapping
    commands:
      - uv sync --frozen --group dev --package profile-unifier-ingestion
      - uv run --package profile-unifier-ingestion python scripts/wait_for_neo4j.py --uri-env HYPERP_NEO4J_STANDALONE_CRM_LANE_A_TEST_URI --user-env HYPERP_NEO4J_STANDALONE_CRM_LANE_A_TEST_USER --password-env HYPERP_NEO4J_STANDALONE_CRM_LANE_A_TEST_PASSWORD --timeout-seconds 90
      - uv run --package profile-unifier-ingestion pytest services/ingestion/tests/test_crm_tenant_mapping_repository_neo4j_preparation.py services/ingestion/tests/test_crm_tenant_mapping_repository_neo4j_lifecycle.py services/ingestion/tests/test_crm_tenant_mapping_repository_neo4j_freshness_integrity.py services/ingestion/tests/test_crm_tenant_mapping_repository_neo4j_strictness.py -q
      - python scripts/ci_selection_manifest.py query-manifest --workflow .woodpecker/main.yaml

  - name: frontend-build
    image: node:22-bookworm
    depends_on:
      - python-checks
      - neo4j-projection-checks
      - neo4j-census-migration-api-checks
      - neo4j-tenant-mapping-checks
    commands:
      - cd services/frontend2
      - npm install --legacy-peer-deps
      - npm test
      - npm run build
