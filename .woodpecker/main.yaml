# MAIN post-merge validation for sparkfn/hyperP — push to `main` only.
# Triggers: push events on the `main` branch only. No deploy, no production secrets,
# no host volumes, no Docker socket, no image push.
# Materially stronger than PR: re-validates python checks on the merged main commit, plus a
# real Next.js production build (catches what tsc-only misses) and a production
# dependency install (mirrors the Dockerfile's `uv sync --frozen --no-dev`).
# Inspect via:  wpci home pipeline ls sparkfn/hyperP --branch main
# Select the latest `event: push` result, then inspect it with `pipeline show`.
#
# SYNC NOTE: the python-checks step below is deliberately duplicated in .woodpecker/pr.yaml
# (Woodpecker has no cross-file includes). When changing a command here, apply the same
# change there so PR and MAIN do not silently diverge.
#
# DEFERRED (follow-up issue): Compose startup + health smoke + Docker image build are
# stronger signals but require a Docker socket mount / trusted repo, which this
# unprivileged PR/MAIN validation boundary forbids. They are tracked separately.
#
# Executor: local Woodpecker (docker backend, untrusted repo — no host volumes/socket).
# A disposable Neo4j 5.26 service supplies the same real-query gate as PR CI.
when:
  event:
    - push
  branch:
    - main

services:
  - name: neo4j
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/ci-person-identifiers
      NEO4J_PLUGINS: "[]"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m

steps:
  # Re-run the PR python suite on the merged main commit to catch merge breakage,
  # then add the production-install signal (mirrors the Dockerfile runtime install).
  - name: python-checks
    image: ghcr.io/astral-sh/uv:python3.12-bookworm
    commands:
      - uv sync --frozen
      - uv run --package profile-unifier-api ruff check services/api/src
      - uv run --package profile-unifier-api ruff format --check services/api/src
      - uv run --package profile-unifier-ingestion ruff check services/ingestion/src
      - uv run --package profile-unifier-ingestion ruff format --check services/ingestion/src
      - uv run --package profile-unifier-api mypy --strict services/api/src
      - uv run --package profile-unifier-ingestion mypy --strict services/ingestion/src
      # pytest per-package (each venv has its runtime + dev deps); the root venv
      # only has lint/type tools, so `uv run pytest` can't import runtime code.
      - uv run --package profile-unifier-api pytest services/api/tests/test_persons_list_queries.py::test_person_list_preferred_address_hydration_does_not_expand_provenance_edges
      - uv run --package profile-unifier-api pytest services/api/tests
      - uv sync --frozen --group training
      - uv run --package profile-unifier-ingestion pytest services/ingestion/tests
      # Production runtime install (no dev group) — verifies the lockfile resolves for
      # the exact install the api/ingestion Dockerfiles run.
      - uv sync --frozen --no-dev --package profile-unifier-api
      - uv sync --frozen --no-dev --package profile-unifier-ingestion

  # Keep the real Neo4j compilation/execution gate aligned with PR validation.
  - name: neo4j-query-checks
    image: ghcr.io/astral-sh/uv:python3.12-bookworm
    environment:
      HYPERP_NEO4J_PERSON_IDENTIFIERS_TEST_URI: bolt://neo4j:7687
      HYPERP_NEO4J_PERSON_IDENTIFIERS_TEST_USER: neo4j
      HYPERP_NEO4J_PERSON_IDENTIFIERS_TEST_PASSWORD: ci-person-identifiers
      HYPERP_NEO4J_PERSON_IDENTIFIERS_TEST_SERVICE_HOST: neo4j
      HYPERP_NEO4J_CRM_METRICS_TEST_URI: bolt://neo4j:7687
      HYPERP_NEO4J_CRM_METRICS_TEST_USER: neo4j
      HYPERP_NEO4J_CRM_METRICS_TEST_PASSWORD: ci-person-identifiers
      HYPERP_NEO4J_CRM_METRICS_TEST_SERVICE_HOST: neo4j
      HYPERP_NEO4J_PERSON_LIST_TEST_URI: bolt://neo4j:7687
      HYPERP_NEO4J_PERSON_LIST_TEST_USER: neo4j
      HYPERP_NEO4J_PERSON_LIST_TEST_PASSWORD: ci-person-identifiers
      HYPERP_NEO4J_PERSON_LIST_TEST_SERVICE_HOST: neo4j
      HYPERP_NEO4J_PERSON_LIST_TEST_ALLOW_SCHEMA_MUTATION: "1"
      HYPERP_NEO4J_PERSON_COMPLETENESS_TEST_URI: bolt://neo4j:7687
      HYPERP_NEO4J_PERSON_COMPLETENESS_TEST_USER: neo4j
      HYPERP_NEO4J_PERSON_COMPLETENESS_TEST_PASSWORD: ci-person-identifiers
      HYPERP_NEO4J_PERSON_COMPLETENESS_TEST_SERVICE_HOST: neo4j
    commands:
      - uv sync --frozen
      - uv run --package profile-unifier-api pytest services/api/tests/test_person_identifiers_neo4j.py services/api/tests/test_person_crm_metrics_neo4j.py services/api/tests/test_persons_list_neo4j_234.py services/api/tests/test_persons_list_plan_neo4j.py -q
      - uv run --package profile-unifier-ingestion pytest services/ingestion/tests/test_person_completeness_migration_neo4j.py -q

  # Real Next.js production build. `next build` runs TypeScript type-checking itself,
  # so this is strictly stronger than the PR `npm run typecheck` step.
  - name: frontend-build
    image: node:22-bookworm
    commands:
      - cd services/frontend2
      - npm install --legacy-peer-deps
      - npm test
      - npm run build
