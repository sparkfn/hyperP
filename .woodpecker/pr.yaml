# PR validation for sparkfn/hyperP — fast feedback only.
# Triggers: pull_request events only. No push, no main/production, no deploy, no secrets.
# A green PR pipeline = candidate for merge to the PR branch's base branch; it is NOT a MAIN,
# staging, or production approval.
# Inspect via:  wpci home pipeline last sparkfn/hyperP --branch <pr-branch>
#
# Executor: local Woodpecker (docker backend, untrusted repo — no host volumes/socket).
# Most tests are mock/fake-based. A disposable Neo4j 5.26 service provides the
# always-executed query compilation gate for database-specific Cypher coverage.
#
# SYNC NOTE: the python-checks step below is deliberately duplicated in .woodpecker/main.yaml
# (Woodpecker has no cross-file includes). When changing a command here, apply the same
# change there so MAIN does not silently diverge from PR.
when:
  event:
    - pull_request

services:
  - name: neo4j
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/ci-person-identifiers
      NEO4J_PLUGINS: "[]"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m

steps:
  # Python: lint + format check + strict typecheck + unit tests, all against the
  # uv workspace venv (dev group includes ruff, mypy, pytest). One install, sequential.
  - name: python-checks
    image: ghcr.io/astral-sh/uv:python3.12-bookworm
    depends_on: []
    environment:
      UV_PROJECT_ENVIRONMENT: .venv-python-checks
      PYTEST_ADDOPTS: "-o cache_dir=.pytest_cache-python-checks"
      PYTHONDONTWRITEBYTECODE: "1"
    commands:
      - uv sync --frozen
      - uv run --package profile-unifier-api ruff check services/api/src
      - uv run --package profile-unifier-api ruff format --check services/api/src
      - uv run --package profile-unifier-ingestion ruff check services/ingestion/src
      - uv run --package profile-unifier-ingestion ruff format --check services/ingestion/src
      - uv run --package profile-unifier-api mypy --strict services/api/src
      - uv run --package profile-unifier-ingestion mypy --strict services/ingestion/src
      # pytest per-package: each service's venv carries its own runtime deps
      # (fastapi/neo4j/celery/redis/...) + dev deps (pytest/pytest-asyncio/fakeredis).
      # The root workspace venv (uv sync) only has lint/type tools, so `uv run pytest`
      # at the root can't import runtime code. Per-package also keeps api and
      # ingestion `src` packages from colliding (both use a top-level `src`).
      - uv run --package profile-unifier-api pytest services/api/tests/test_persons_list_queries.py::test_person_list_preferred_address_hydration_does_not_expand_provenance_edges
      - uv run --package profile-unifier-api pytest services/api/tests
      - uv sync --frozen --group training
      - uv run --package profile-unifier-ingestion pytest services/ingestion/tests

  # Compile and execute the optimized identifier query against the production
  # Neo4j major/minor. This is a service container on the untrusted workflow
  # network; it does not require a Docker socket, host volume, or repository secret.
  - name: neo4j-query-checks
    image: ghcr.io/astral-sh/uv:python3.12-bookworm
    depends_on: []
    environment:
      UV_PROJECT_ENVIRONMENT: .venv-neo4j-query-checks
      PYTEST_ADDOPTS: "-o cache_dir=.pytest_cache-neo4j-query-checks"
      PYTHONDONTWRITEBYTECODE: "1"
      HYPERP_NEO4J_PERSON_IDENTIFIERS_TEST_URI: bolt://neo4j:7687
      HYPERP_NEO4J_PERSON_IDENTIFIERS_TEST_USER: neo4j
      HYPERP_NEO4J_PERSON_IDENTIFIERS_TEST_PASSWORD: ci-person-identifiers
      HYPERP_NEO4J_PERSON_IDENTIFIERS_TEST_SERVICE_HOST: neo4j
      HYPERP_NEO4J_CRM_METRICS_TEST_URI: bolt://neo4j:7687
      HYPERP_NEO4J_CRM_METRICS_TEST_USER: neo4j
      HYPERP_NEO4J_CRM_METRICS_TEST_PASSWORD: ci-person-identifiers
      HYPERP_NEO4J_CRM_METRICS_TEST_SERVICE_HOST: neo4j
      HYPERP_NEO4J_PERSON_LIST_TEST_URI: bolt://neo4j:7687
      HYPERP_NEO4J_PERSON_LIST_TEST_USER: neo4j
      HYPERP_NEO4J_PERSON_LIST_TEST_PASSWORD: ci-person-identifiers
      HYPERP_NEO4J_PERSON_LIST_TEST_SERVICE_HOST: neo4j
      HYPERP_NEO4J_PERSON_LIST_TEST_ALLOW_SCHEMA_MUTATION: "1"
      HYPERP_NEO4J_PERSON_COMPLETENESS_TEST_URI: bolt://neo4j:7687
      HYPERP_NEO4J_PERSON_COMPLETENESS_TEST_USER: neo4j
      HYPERP_NEO4J_PERSON_COMPLETENESS_TEST_PASSWORD: ci-person-identifiers
      HYPERP_NEO4J_PERSON_COMPLETENESS_TEST_SERVICE_HOST: neo4j
      HYPERP_NEO4J_LOYALTY_POINTS_TEST_URI: bolt://neo4j:7687
      HYPERP_NEO4J_LOYALTY_POINTS_TEST_USER: neo4j
      HYPERP_NEO4J_LOYALTY_POINTS_TEST_PASSWORD: ci-person-identifiers
      HYPERP_NEO4J_LOYALTY_POINTS_TEST_SERVICE_HOST: neo4j
      HYPERP_NEO4J_CRM_DEAL_COUNT_TEST_URI: bolt://neo4j:7687
      HYPERP_NEO4J_CRM_DEAL_COUNT_TEST_USER: neo4j
      HYPERP_NEO4J_CRM_DEAL_COUNT_TEST_PASSWORD: ci-person-identifiers
      HYPERP_NEO4J_CRM_DEAL_COUNT_TEST_SERVICE_HOST: neo4j
      HYPERP_NEO4J_CONTROL_MIGRATION_TEST_URI: bolt://neo4j:7687
      HYPERP_NEO4J_CONTROL_MIGRATION_TEST_USER: neo4j
      HYPERP_NEO4J_CONTROL_MIGRATION_TEST_PASSWORD: ci-person-identifiers
      HYPERP_NEO4J_CONTROL_MIGRATION_TEST_SERVICE_HOST: neo4j
      HYPERP_NEO4J_STANDALONE_CRM_CENSUS_TEST_URI: bolt://neo4j:7687
      HYPERP_NEO4J_STANDALONE_CRM_CENSUS_TEST_USER: neo4j
      HYPERP_NEO4J_STANDALONE_CRM_CENSUS_TEST_PASSWORD: ci-person-identifiers
      HYPERP_NEO4J_STANDALONE_CRM_CENSUS_TEST_SERVICE_HOST: neo4j
      HYPERP_NEO4J_STANDALONE_CRM_LANE_A_TEST_URI: bolt://neo4j:7687
      HYPERP_NEO4J_STANDALONE_CRM_LANE_A_TEST_USER: neo4j
      HYPERP_NEO4J_STANDALONE_CRM_LANE_A_TEST_PASSWORD: ci-person-identifiers
      HYPERP_NEO4J_STANDALONE_CRM_LANE_A_TEST_SERVICE_HOST: neo4j
      HYPERP_NEO4J_CRM_REPAIR_LEDGER_TEST_URI: bolt://neo4j:7687
      HYPERP_NEO4J_CRM_REPAIR_LEDGER_TEST_USER: neo4j
      HYPERP_NEO4J_CRM_REPAIR_LEDGER_TEST_PASSWORD: ci-person-identifiers
      HYPERP_NEO4J_CRM_REPAIR_LEDGER_TEST_SERVICE_HOST: neo4j
    commands:
      - uv sync --frozen
      - uv run --package profile-unifier-api pytest services/api/tests/test_person_identifiers_neo4j.py services/api/tests/test_person_crm_metrics_neo4j.py services/api/tests/test_persons_list_neo4j_234.py services/api/tests/test_persons_list_possible_match_neo4j.py services/api/tests/test_persons_list_plan_neo4j.py services/api/tests/test_identity_link_revisions_neo4j.py -q
      - uv run --package profile-unifier-ingestion pytest services/ingestion/tests/test_person_completeness_migration_neo4j.py services/ingestion/tests/test_loyalty_points_migration_neo4j.py services/ingestion/tests/test_crm_deal_count_migration_neo4j.py services/ingestion/tests/test_ingestion_control_instance_migration_neo4j.py -q
      - uv run --package profile-unifier-ingestion pytest services/ingestion/tests/test_standalone_crm_census_neo4j.py -q
      - uv run --package profile-unifier-ingestion pytest services/ingestion/tests/test_standalone_crm_lane_a_schema_neo4j.py -q
      - uv run --package profile-unifier-ingestion pytest services/ingestion/tests/test_crm_deal_identity_repair_ledger_neo4j.py -q

  # Frontend (services/frontend2 — active app): tsc --noEmit + eslint errors-only.
  # NOTE: `npm run lint` uses `--max-warnings 9` but the clean tree already carries
  # ~18 pre-existing react-hooks/set-state-in-effect warnings (0 errors), so the
  # project lint script is red on a clean tree. CI runs `npx eslint src` (errors
  # only) so the gate is green on a clean tree and catches new errors. The repo-local
  # `npm run lint` budget is a separate, known follow-up (see CLAUDE.md).
  - name: frontend-checks
    image: node:22-bookworm
    depends_on: []
    commands:
      - cd services/frontend2
      - npm install --legacy-peer-deps
      - npm run typecheck
      - npx eslint src
      - npm test
